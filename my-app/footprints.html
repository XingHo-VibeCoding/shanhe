<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诗人足迹 · 苏轼｜诗迹山河</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f4eee1;
    color: #3a3226;
    min-height: 100vh;
  }

  /* ===== 顶部返回条 ===== */
  .topbar {
    background:
      linear-gradient(rgba(42,34,22,.78), rgba(42,34,22,.78)),
      url(assets/pic_jsqs.jpg) center 40% / cover no-repeat;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar a {
    color: #f5f0e6;
    font-size: 14px;
    text-decoration: none;
    letter-spacing: 1px;
  }
  .topbar a:hover { opacity: .8; }
  .topbar .t { font-size: 13px; letter-spacing: 3px; color: #f5f0e6; opacity: .85; }

  .container { max-width: 1180px; margin: 0 auto; padding: 26px 16px 80px; }

  /* ===== 诗人题头 ===== */
  .poet-head {
    background: #fdfbf5;
    border: 1px solid #d8cdb8;
    border-radius: 6px;
    padding: 26px 28px 22px;
    box-shadow: 0 2px 8px rgba(58,50,38,.05);
    display: flex;
    gap: 22px;
    align-items: flex-start;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .poet-name {
    font-family: "STKaiti", "KaiTi", "楷体", serif;
    font-size: 34px;
    letter-spacing: 6px;
    line-height: 1.2;
    white-space: nowrap;
  }
  .poet-name .alias { font-size: 15px; color: #8a7a5f; letter-spacing: 2px; margin-left: 10px; }
  .poet-meta { font-size: 13px; color: #8a7a5f; letter-spacing: 1px; margin-top: 6px; }
  .poet-intro {
    flex: 1;
    min-width: 260px;
    font-size: 14px;
    line-height: 2;
    color: #5a4f3f;
  }
  .poet-stats { display: flex; gap: 0; margin-top: 4px; }
  .stat {
    text-align: center;
    padding: 0 18px;
    border-left: 1px solid #d8cdb8;
  }
  .stat:first-child { border-left: none; padding-left: 0; }
  .stat b { font-family: "STKaiti", "KaiTi", serif; font-size: 26px; color: #a3402f; display: block; }
  .stat span { font-size: 12px; color: #8a7a5f; letter-spacing: 2px; }

  /* ===== 筛选 ===== */
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
  .filters .lbl { font-size: 13px; color: #8a7a5f; letter-spacing: 2px; }
  .chip {
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 2px;
    padding: 5px 16px;
    border-radius: 16px;
    border: 1px solid #c9bda3;
    background: transparent;
    color: #5a4f3f;
    cursor: pointer;
    transition: all .2s ease;
  }
  .chip:hover { border-color: #a3402f; color: #a3402f; }
  .chip.on { background: #a3402f; border-color: #a3402f; color: #fdfbf5; }
  .chip:focus-visible { outline: 2px solid #a3402f; outline-offset: 2px; }

  /* ===== 主布局：地图 + 时间轴 ===== */
  .layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: start; }

  /* --- 地图（水墨长卷） --- */
  .map-card {
    background: #fdfbf5;
    border: 1px solid #d8cdb8;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(58,50,38,.05);
    overflow: hidden;
    position: sticky;
    top: 56px;
  }
  .map-card .map-title {
    font-family: "STKaiti", "KaiTi", serif;
    font-size: 15px;
    letter-spacing: 4px;
    color: #a3402f;
    padding: 12px 18px 0;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .map-card .map-sub { font-size: 11px; color: #8a7a5f; letter-spacing: 1px; font-family: sans-serif; }
  #mapSvg { display: block; width: 100%; height: auto; }

  /* 地图标记 */
  .marker { cursor: pointer; }
  .marker .dot { transition: r .2s ease; }
  .marker .ring { transition: stroke-width .2s ease; }
  .marker:hover .ring { stroke-width: 2.4; }
  .marker text {
    font-size: 16px;
    font-family: "STKaiti", "KaiTi", serif;
    fill: #3a3226;
    paint-order: stroke;
    stroke: #fdfbf5;
    stroke-width: 3px;
    stroke-linejoin: round;
  }
  .marker text.modern { font-size: 12.5px; fill: #8a7a5f; font-family: sans-serif; }
  .marker text.seq {
    font-size: 10px;
    font-family: "Microsoft YaHei", sans-serif;
    font-weight: bold;
    fill: #fdfbf5;
    stroke: none;
  }
  .marker.active .ring { stroke-width: 2.6; }
  .marker .halo { opacity: 0; }
  .marker.active .halo { opacity: 1; animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse {
    0% { transform: scale(.4); opacity: .8; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  .marker:focus { outline: none; }
  .marker:focus-visible .dot { stroke: #a3402f; stroke-width: 3.5; }
  .map-legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    padding: 8px 18px 14px;
    font-size: 12px;
    color: #5a4f3f;
  }
  .map-legend i {
    display: inline-block;
    width: 9px; height: 9px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: -1px;
  }

  /* --- 时间轴 --- */
  .timeline { position: relative; padding-left: 26px; }
  .timeline::before {
    content: "";
    position: absolute;
    left: 8px; top: 6px; bottom: 6px;
    width: 1px;
    background: linear-gradient(#c9bda3, #d8cdb8);
  }
  .node {
    position: relative;
    background: #fdfbf5;
    border: 1px solid #d8cdb8;
    border-radius: 6px;
    padding: 18px 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(58,50,38,.05);
    transition: border-color .25s ease, box-shadow .25s ease;
  }
  .node::before {
    content: "";
    position: absolute;
    left: -23px; top: 26px;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--dot, #b08a3e);
    box-shadow: 0 0 0 3px #f4eee1;
  }
  .node.active { border-color: #a3402f; box-shadow: 0 2px 14px rgba(163,64,47,.15); }
  .node-year {
    font-family: "STKaiti", "KaiTi", serif;
    color: #a3402f;
    font-size: 15px;
    letter-spacing: 1px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .node-year .stage {
    font-size: 11px;
    font-family: sans-serif;
    color: #fdfbf5;
    background: var(--dot, #b08a3e);
    border-radius: 10px;
    padding: 1px 10px;
    letter-spacing: 2px;
  }
  .node-place {
    font-family: "STKaiti", "KaiTi", serif;
    font-size: 21px;
    letter-spacing: 3px;
    margin: 8px 0 2px;
  }
  .node-place .modern {
    font-size: 12px;
    font-family: sans-serif;
    color: #8a7a5f;
    letter-spacing: 1px;
    margin-left: 8px;
  }
  .node-event { font-size: 13.5px; line-height: 2; color: #5a4f3f; margin: 8px 0 4px; }

  /* 诗作折叠（沿用 Day 11 反馈模式：动效 + 文字 + 键盘） */
  .fold-head {
    font-size: 13.5px;
    font-weight: normal;
    color: #a3402f;
    letter-spacing: 2px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 0 5px;
    border-top: 1px dashed #e2d8c3;
    margin-top: 8px;
  }
  .fold-head:first-of-type { border-top: none; }
  .fold-head:hover { opacity: .8; }
  .fold-head:focus-visible { outline: 2px solid #a3402f; outline-offset: 3px; border-radius: 2px; }
  .fold-right { margin-left: auto; display: flex; align-items: center; gap: 7px; }
  .fold-state { font-size: 11px; color: #8a7a5f; letter-spacing: 1px; font-weight: normal; }
  .chev { width: 11px; height: 11px; flex: none; transition: transform .25s ease; }
  .fold-card.open .chev { transform: rotate(180deg); }
  .fold { max-height: 0; overflow: hidden; transition: max-height .3s ease; }
  .poem-title-link { color: inherit; text-decoration: none; border-bottom: 1px dotted #c9bda3; }
  .poem-title-link:hover { color: #a3402f; border-bottom-color: #a3402f; }
  .poem-body {
    font-family: "STKaiti", "KaiTi", "楷体", serif;
    font-size: 15px;
    line-height: 2.1;
    white-space: pre-wrap;
    color: #3a3226;
    padding: 2px 2px 10px;
  }
  .poem-note { font-size: 12px; color: #8a7a5f; line-height: 1.9; padding-bottom: 10px; }

  /* 景点 */
  .spot {
    background: #f7f2e6;
    border: 1px solid #e2d8c3;
    border-radius: 5px;
    padding: 10px 14px;
    margin-top: 8px;
    font-size: 12.5px;
    line-height: 1.9;
    color: #5a4f3f;
  }
  .spot b { font-family: "STKaiti", "KaiTi", serif; font-size: 14px; letter-spacing: 1px; color: #3a3226; }
  .spot .coords { color: #a3402f; font-size: 11px; font-family: Consolas, monospace; }

  .tl-count {
    font-size: 13px; color: #8a7a5f; letter-spacing: 2px;
    padding: 0 0 14px 2px;
  }
  .tl-count b { color: #a3402f; font-weight: 600; }
  .empty {
    text-align: center; color: #8a7a5f; padding: 40px 0; letter-spacing: 2px;
  }
  .empty .e-msg { margin-bottom: 16px; }

  /* ===== 入场动画（点击「诗人足迹」后播放 · 宣纸水墨卷版） ===== */
  #intro {
    position: fixed; inset: 0; z-index: 99;
    cursor: pointer;
    overflow: hidden;
    color: #2e2921;
    filter: blur(0);
    background:
      radial-gradient(ellipse at 22% 16%, rgba(255,255,252,.75), transparent 55%),
      radial-gradient(ellipse at 80% 26%, rgba(210,199,175,.28), transparent 60%),
      radial-gradient(ellipse at 50% 34%, #fcfaf3 0%, #f3eddd 58%, #e9e0c9 100%);
  }
  #intro.out { opacity: 0; filter: blur(12px); transition: opacity .9s ease-out, filter .9s ease-out; pointer-events: none; }
  /* 卷边微暗（宣纸四角） */
  #intro::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 46%, transparent 58%, rgba(58,50,38,.13) 100%);
  }
  /* 流动的云雾（白雾缭绕远山） */
  #intro .mist {
    position: absolute; width: 140vw; height: 55vh; pointer-events: none;
    background: radial-gradient(ellipse, rgba(253,251,245,.7) 0%, rgba(253,251,245,0) 68%);
  }
  #intro .mist.m1 { top: 16%; left: -22vw; animation: mistDrift 17s ease-in-out -3s infinite alternate; }
  #intro .mist.m2 { bottom: 10%; right: -32vw; animation: mistDrift 23s ease-in-out infinite alternate; }
  @keyframes mistDrift { from { transform: translateX(0); } to { transform: translateX(6vw); } }

  /* 朱红圆日：如墨点入水，晕开即成 */
  #intro .sun {
    position: absolute; top: 11%; right: 17%;
    width: clamp(58px, 9vw, 104px); height: clamp(58px, 9vw, 104px);
    border-radius: 50%;
    background: radial-gradient(circle, #c4523d 0%, #c4523d 52%, rgba(196,82,61,.35) 66%, rgba(196,82,61,0) 74%);
    opacity: 0; animation: sunIn 1.7s ease-out .25s both;
  }
  @keyframes sunIn {
    from { opacity: 0; transform: scale(.3); filter: blur(14px); }
    60%  { opacity: .92; }
    to   { opacity: .88; transform: scale(1); filter: blur(0); }
  }

  /* 三层墨山：远淡近浓，如墨迹入纸晕染浮现 */
  #intro .mtn { position: absolute; left: 0; bottom: 0; width: 100%; opacity: 0; }
  #intro .mtn.m-far  { height: 34vh; animation: inkIn 2.2s ease-out .15s both; }
  #intro .mtn.m-mid  { height: 27vh; animation: inkIn 2.1s ease-out .5s both; }
  #intro .mtn.m-near { height: 20vh; animation: inkIn 1.9s ease-out .85s both; }
  @keyframes inkIn {
    from { opacity: 0; transform: translateY(42px); filter: blur(16px); }
    to   { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  /* 江面孤舟：一叶扁舟随波轻晃 */
  #intro .boat {
    position: absolute; left: 13%; bottom: 15%;
    width: clamp(54px, 7vw, 92px); height: auto; opacity: 0;
    animation: boatIn 1.6s ease-out 1.3s both, boatBob 4.2s ease-in-out 3s infinite alternate;
  }
  @keyframes boatIn { from { opacity: 0; filter: blur(8px); } to { opacity: .8; filter: blur(0); } }
  @keyframes boatBob { from { transform: translateY(0) rotate(-1.2deg); } to { transform: translateY(4px) rotate(1.4deg); } }

  /* 天际飞鸟：淡墨三两，掠过画卷 */
  #intro .birds { position: absolute; inset: 0 0 46% 0; pointer-events: none; overflow: hidden; }
  #intro .bird { position: absolute; left: 0; top: 26px; opacity: 0; animation: birdFly 36s linear 1.8s infinite; }
  #intro .bird.b2 { top: 54px; animation-duration: 44s; animation-delay: 14s; }
  #intro .bird.b3 { top: 10px; animation-duration: 50s; animation-delay: 28s; }
  @keyframes birdFly {
    0%   { transform: translateX(108vw); opacity: 0; }
    6%   { opacity: .55; }
    88%  { opacity: .55; }
    100% { transform: translateX(-14vw); opacity: 0; }
  }

  /* 诗人帧：仿古画题款——诗句竖排浓墨居右，落款小字 + 朱印居左 */
  #intro .frame {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: flex-end;
    gap: clamp(14px, 2.4vw, 26px);
    padding-right: clamp(22px, 9vw, 130px);
    opacity: 0;
    animation: frameCycle 1.3s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes frameCycle {
    0%   { opacity: 0; }
    18%  { opacity: 1; }
    78%  { opacity: 1; }
    100% { opacity: 0; }
  }
  #intro .verse {
    font-family: "STKaiti", "KaiTi", "楷体", serif;
    writing-mode: vertical-rl;
    font-size: clamp(30px, 4.8vw, 50px);
    letter-spacing: clamp(6px, 1.1vw, 12px);
    color: #2e2921;
    text-shadow: 0 1px 0 rgba(255,255,255,.5);
    white-space: nowrap;
  }
  #intro .verse .ch { display: inline-block; opacity: 0; animation: chIn .5s cubic-bezier(.22,1,.36,1) both; }
  @keyframes chIn {
    from { opacity: 0; filter: blur(7px); transform: translateY(16px) scale(1.18); }
    to   { opacity: 1; filter: blur(0); transform: translateY(0) scale(1); }
  }
  /* 落款：诗人名小字竖排 + 朝代朱印 */
  #intro .sigcol { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #intro .pname {
    font-family: "STKaiti", "KaiTi", "楷体", serif;
    writing-mode: vertical-rl;
    font-size: clamp(17px, 2.2vw, 24px);
    letter-spacing: 7px;
    color: #6f6656;
    opacity: 0; animation: inkSoft .6s ease-out both;
  }
  #intro .seal {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    background: #a3402f; color: #f7f1e1;
    font-family: "STKaiti", "KaiTi", "楷体", serif;
    font-size: 16px;
    border-radius: 3px;
    opacity: 0;
    animation: sealStamp .38s cubic-bezier(.34,1.45,.64,1) both;
    box-shadow: 0 1px 8px rgba(163,64,47,.3);
  }
  @keyframes inkSoft { from { opacity: 0; filter: blur(6px); } to { opacity: 1; filter: blur(0); } }
  @keyframes sealStamp {
    from { opacity: 0; transform: rotate(-3deg) scale(1.8); }
    to   { opacity: 1; transform: rotate(-3deg) scale(1); }
  }
  /* 主角帧（苏轼）：名句染朱红 */
  #intro .frame.hero .verse { color: #a3402f; }
  #intro .frame.hero .verse .ch { text-shadow: 0 0 18px rgba(163,64,47,.25); }

  /* 卷末题名：浓墨题于卷心，钤朱印 */
  #introTitle {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    text-align: center; opacity: 0;
    animation: introTitle 1.1s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes introTitle { from { opacity: 0; transform: translate(-50%, -46%); filter: blur(10px); } to { opacity: 1; transform: translate(-50%, -50%); filter: blur(0); } }
  #introTitle h2 {
    font-family: "STKaiti", "KaiTi", "楷体", serif;
    font-size: clamp(34px, 6.5vw, 58px);
    font-weight: 500;
    color: #2e2921;
    letter-spacing: 20px;
    padding-left: 20px;
    white-space: nowrap;
  }
  #introTitle p { font-size: 13px; color: #8a7a5f; letter-spacing: 7px; padding-left: 7px; margin-top: 14px; white-space: nowrap; }
  #introTitle .tseal {
    width: 34px; height: 34px; margin: 18px auto 0;
    display: flex; align-items: center; justify-content: center;
    background: #a3402f; color: #f7f1e1;
    font-family: "STKaiti", "KaiTi", "楷体", serif;
    font-size: 19px;
    border-radius: 3px;
    opacity: 0; animation: sealStamp .4s cubic-bezier(.34,1.45,.64,1) both;
    box-shadow: 0 1px 8px rgba(163,64,47,.3);
  }
  /* 底部行迹线：墨线走笔，朱笔收锋 */
  #introTrack { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: rgba(58,50,38,.08); }
  #introTrack::after {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    background: linear-gradient(90deg, rgba(111,102,86,.55), #2e2921 82%, #a3402f);
    animation: trackGrow 5.6s linear both;
  }
  @keyframes trackGrow { to { width: 100%; } }
  #introSkip {
    position: absolute; right: 22px; bottom: 20px;
    font-size: 12px; color: #8a7a5f; letter-spacing: 3px;
    opacity: 0; animation: skipIn .8s ease-out 1s both;
  }
  @keyframes skipIn { to { opacity: .9; } }
  @media (max-width: 560px) {
    #intro .frame { padding-right: 20px; gap: 12px; }
    #intro .verse { font-size: 26px; letter-spacing: 6px; }
    #intro .pname { font-size: 15px; letter-spacing: 5px; }
    #introTitle h2 { letter-spacing: 12px; padding-left: 12px; }
  }

  /* ===== 响应式 ===== */
  @media (max-width: 920px) {
    .layout { grid-template-columns: 1fr; }
    .map-card { position: static; }
    .poet-head { padding: 20px; }
    .poet-name { font-size: 27px; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <a href="home.html">← 返回首页</a>
    <span class="t">诗人足迹</span>
    <nav style="margin-left:auto;display:flex;gap:14px;">
      <a style="color:#f5f0e6;opacity:.85;font-size:13px;text-decoration:none;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='.85'" href="index.html">诗词查询</a>
      <a style="color:#f5f0e6;opacity:.85;font-size:13px;text-decoration:none;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='.85'" href="tour.html">沉浸演示</a>
    </nav>
  </div>

  <main class="container">
    <!-- 诗人题头（数据渲染） -->
    <section class="poet-head" id="poetHead"></section>

    <!-- 筛选 -->
    <div class="filters" id="filters">
      <span class="lbl">行迹筛选</span>
      <!-- chips 由 JS 生成 -->
    </div>

    <div class="layout">
      <!-- 水墨长卷地图 -->
      <section class="map-card" aria-label="足迹示意地图">
        <div class="map-title">
          <span>东坡行迹图</span>
          <span class="map-sub">依经纬落位 · 古地名配今地</span>
        </div>
        <svg id="mapSvg" viewBox="0 0 740 640" role="img" aria-label="苏轼一生足迹示意地图"></svg>
        <div class="map-legend" id="mapLegend"></div>
      </section>

      <!-- 时间轴 -->
      <section class="timeline" id="timeline" aria-label="足迹时间轴"></section>
    </div>
  </main>

<script>
  /* ================= 数据与状态 ================= */
  const TYPE_META = {
    birth:    { label: "出生", color: "#6b7f4e" },
    official: { label: "为官", color: "#b08a3e" },
    exile:    { label: "贬谪", color: "#a3402f" },
    death:    { label: "离世", color: "#5a4f3f" }
  };
  let DATA = null;          // 当前诗人
  let filterType = "all";   // 当前筛选
  let activeId = null;      // 当前选中节点

  /* ================= 工具 ================= */
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  const SVG_NS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs) {
    const el = document.createElementNS(SVG_NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  /* Catmull-Rom → 三次贝塞尔：把折点连成平滑曲线 */
  function smoothPath(pts) {
    if (pts.length < 2) return "";
    let d = "M" + pts[0].x + " " + pts[0].y;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i],
            p2 = pts[i + 1], p3 = pts[Math.min(i + 2, pts.length - 1)];
      d += " C" + (p1.x + (p2.x - p0.x) / 6) + " " + (p1.y + (p2.y - p0.y) / 6) +
           " "  + (p2.x - (p3.x - p1.x) / 6) + " " + (p2.y - (p3.y - p1.y) / 6) +
           " "  + p2.x + " " + p2.y;
    }
    return d;
  }

  /* ================= 经纬度 → 长卷坐标 =================
     等距圆柱投影，标准纬线 35°N（cos35≈0.82）。
     按当前可见行迹的经纬度范围自适应取景——
     不铺整个疆域，让点位铺满长卷；筛选时自动聚焦。
     仅示意相对位置，不描绘任何疆界。 */
  const W = 740, H = 640;
  const PAD_L = 64, PAD_R = 156, PAD_T = 64, PAD_B = 64;  // 右侧多留：给地名标签
  const K = Math.cos(35 * Math.PI / 180);
  const MAX_SCALE = 60;   // 点位过少（如筛选后只剩 1 处）时防过度放大
  let PRJ = null;
  function fitProjection(nodes) {
    if (!nodes.length) { PRJ = null; return; }
    const xs = nodes.map(n => n.lng * K), ys = nodes.map(n => -n.lat);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const bw = Math.max(maxX - minX, 0.5), bh = Math.max(maxY - minY, 0.5);
    const scale = Math.min((W - PAD_L - PAD_R) / bw, (H - PAD_T - PAD_B) / bh, MAX_SCALE);
    const ox = PAD_L + ((W - PAD_L - PAD_R) - bw * scale) / 2;
    const oy = PAD_T + ((H - PAD_T - PAD_B) - bh * scale) / 2;
    PRJ = { scale, ox, oy, minX, minY };
  }
  function proj(lng, lat) {
    return {
      x: PRJ.ox + (lng * K - PRJ.minX) * PRJ.scale,
      y: PRJ.oy + (-lat - PRJ.minY) * PRJ.scale
    };
  }

  /* ================= 画家题头 ================= */
  function renderHead(p) {
    document.getElementById("poetHead").innerHTML =
      '<div>' +
        '<div class="poet-name">' + esc(p.name) + '<span class="alias">' + esc(p.alias) + '</span></div>' +
        '<div class="poet-meta">' + esc(p.dynasty) + ' · ' + esc(p.born) + '—' + esc(p.died) + '</div>' +
      '</div>' +
      '<div class="poet-intro">' + esc(p.intro) + '</div>' +
      '<div class="poet-stats">' +
        '<div class="stat"><b>' + p.footprints.length + '</b><span>行迹</span></div>' +
        '<div class="stat"><b>' + p.footprints.reduce((n, f) => n + f.poems.length, 0) + '</b><span>诗作</span></div>' +
        '<div class="stat"><b>' + p.footprints.reduce((n, f) => n + f.spots.length, 0) + '</b><span>景点</span></div>' +
      '</div>';
  }

  /* ================= 地图 ================= */
  function renderMap() {
    const svg = document.getElementById("mapSvg");
    svg.innerHTML = "";

    /* --- 底：远山与水纹（纯装饰水墨，非地理描绘） --- */
    const bg = svgEl("g", { opacity: ".5" });
    const mts = [
      "M0 570 Q 90 440 190 545 Q 260 615 355 550 Q 455 485 545 560 Q 635 625 740 540 L 740 640 L 0 640 Z",
      "M0 130 Q 120 45 250 118 Q 355 180 480 108 Q 600 35 740 112 L 740 0 L 0 0 Z"
    ];
    mts.forEach(d => bg.appendChild(svgEl("path", { d, fill: "#3a3226", opacity: ".05" })));
    svg.appendChild(bg);
    // 淡水纹
    for (let i = 0; i < 3; i++) {
      svg.appendChild(svgEl("path", {
        d: "M30 " + (250 + i * 140) + " Q 200 " + (235 + i * 140) + " 370 " + (255 + i * 140) + " T 710 " + (245 + i * 140),
        fill: "none", stroke: "#3a3226", "stroke-width": "1", opacity: ".06"
      }));
    }

    const nodes = visibleNodes();
    fitProjection(nodes);   // 按当前行迹范围取景（筛选时自动聚焦）

    /* --- 旅程路线：平滑曲线 + 圆点虚线（复古行程图样式） --- */
    if (nodes.length > 1) {
      const pts = nodes.map(n => proj(n.lng, n.lat));
      // 底层：极淡的实线，托住虚线
      svg.appendChild(svgEl("path", {
        d: smoothPath(pts),
        fill: "none", stroke: "#8a7a5f", "stroke-width": "1",
        opacity: ".22"
      }));
      // 上层：圆点虚线
      svg.appendChild(svgEl("path", {
        d: smoothPath(pts),
        fill: "none", stroke: "#a3402f", "stroke-width": "2",
        "stroke-dasharray": "0.5 7", "stroke-linecap": "round",
        opacity: ".55"
      }));
    }

    /* --- 标记 --- */
    nodes.forEach((n, i) => {
      const { x, y } = proj(n.lng, n.lat);
      const c = TYPE_META[n.type].color;
      const g = svgEl("g", {
        class: "marker" + (n.id === activeId ? " active" : ""),
        tabindex: "0", role: "button",
        "aria-label": n.year + "年 " + n.place + "，" + TYPE_META[n.type].label + "，" + n.modern
      });
      g.dataset.id = n.id;

      const halo = svgEl("circle", { cx: x, cy: y, r: 18, fill: "none", stroke: c, "stroke-width": 2, class: "halo" });
      halo.style.transformOrigin = x + "px " + y + "px";
      g.appendChild(halo);
      // 外圈：同色淡底 + 细环
      g.appendChild(svgEl("circle", {
        cx: x, cy: y, r: 11.5, fill: c, "fill-opacity": ".16",
        stroke: c, "stroke-width": "1.4", class: "ring"
      }));
      // 内芯：实心圆
      g.appendChild(svgEl("circle", { cx: x, cy: y, r: 8, fill: c, stroke: "#fdfbf5", "stroke-width": "1.6", class: "dot" }));
      // 序号（与时间轴顺序对应）
      const seq = svgEl("text", { x: x, y: y, class: "seq", "text-anchor": "middle" });
      seq.style.dominantBaseline = "central";
      seq.textContent = i + 1;
      g.appendChild(seq);

      // 标签：古地名 + 今地名（古今对照）
      const label = svgEl("text", { x: x + 17, y: y + 1, class: "gname" });
      label.style.dominantBaseline = "middle";
      label.textContent = n.place;
      g.appendChild(label);
      const mod = svgEl("text", { x: x + 17, y: y + 19, class: "modern" });
      mod.textContent = n.modern.replace("今", "");
      g.appendChild(mod);

      g.addEventListener("click", () => selectNode(n.id, true));
      g.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectNode(n.id, true); }
      });
      svg.appendChild(g);
    });

    /* --- 图例 --- */
    document.getElementById("mapLegend").innerHTML = Object.keys(TYPE_META)
      .map(t => '<span><i style="background:' + TYPE_META[t].color + '"></i>' + TYPE_META[t].label + '</span>').join("");
  }

  /* ================= 时间轴 ================= */
  function visibleNodes() {
    return DATA.footprints.filter(f => filterType === "all" || f.type === filterType);
  }

  function poemFold(p) {
    return (
      '<div class="fold-card">' +
        '<h3 class="fold-head" tabindex="0" role="button" aria-expanded="false" onclick="toggleCard(this)" onkeydown="keyCard(event, this)">' +
          '<span><a class="poem-title-link" href="detail.html?title=' + encodeURIComponent(p.title) + '&from=footprints">' + esc(p.title) + '</a>' +
          '　<em style="font-style:normal;font-size:11px;color:#8a7a5f;">' + esc(p.genre) + ' · ' + esc(p.year) + '</em></span>' +
          '<span class="fold-right"><span class="fold-state">已收起</span>' +
          '<svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4 L6 8 L10 4" fill="none" stroke="#a3402f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
        '</h3>' +
        '<div class="fold"><div class="poem-body">' + esc(p.content) + '</div>' +
        (p.note ? '<div class="poem-note">◆ ' + esc(p.note) + '</div>' : '') + '</div>' +
      '</div>'
    );
  }

  function spotCard(s) {
    return (
      '<div class="spot"><b>' + esc(s.name) + '</b>　<span style="color:#8a7a5f;">' + esc(s.modern) + '</span><br>' +
      esc(s.desc) + '<br><span class="coords">' + s.lat + "°N, " + s.lng + "°E" + '</span></div>'
    );
  }

  function renderTimeline() {
    const tl = document.getElementById("timeline");
    const nodes = visibleNodes();
    const label = filterType === "all" ? "全部行迹" : TYPE_META[filterType].label;
    if (!nodes.length) {
      // 无结果：明确空状态文案 + 返回全量的路径
      tl.innerHTML =
        '<div class="empty">' +
          '<div class="e-msg">「' + label + '」暂无行迹记录</div>' +
          '<button class="chip" onclick="resetFilter()">查看全部行迹</button>' +
        '</div>';
      return;
    }
    tl.innerHTML =
      '<div class="tl-count">当前筛选：<b>' + label + '</b> · 共 ' + nodes.length + ' 处行迹</div>' +
      nodes.map(n => {
      const meta = TYPE_META[n.type];
      return (
        '<article class="node' + (n.id === activeId ? " active" : "") + '" id="card-' + n.id + '" ' +
              'style="--dot:' + meta.color + '" data-id="' + n.id + '" tabindex="0">' +
          '<div class="node-year">' + esc(n.years) + '<span class="stage">' + meta.label + '</span></div>' +
          '<div class="node-place">' + esc(n.place) + '<span class="modern">' + esc(n.modern) + '</span></div>' +
          '<p class="node-event">' + esc(n.event) + '</p>' +
          n.poems.map(poemFold).join("") +
          n.spots.map(spotCard).join("") +
        '</article>'
      );
    }).join("");

    // 卡片点击 → 选中（点折叠头/链接时不冒泡触发）
    tl.querySelectorAll(".node").forEach(card => {
      card.addEventListener("click", e => {
        if (e.target.closest(".fold-head") || e.target.closest("a")) return;
        selectNode(card.dataset.id, false);
      });
      card.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.target.closest(".fold-head") && !e.target.closest("a")) {
          selectNode(card.dataset.id, false);
        }
      });
    });
  }

  /* ================= 选中联动（地图 ⇄ 时间轴） ================= */
  function selectNode(id, scrollCard) {
    activeId = id;
    // 更新地图标记
    document.querySelectorAll(".marker").forEach(m =>
      m.classList.toggle("active", m.dataset.id === id));
    // 更新时间轴卡片
    document.querySelectorAll(".node").forEach(c =>
      c.classList.toggle("active", c.dataset.id === id));
    if (scrollCard) {
      const card = document.getElementById("card-" + id);
      if (card) card.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  }

  /* 清空筛选，回到全量（无结果状态下的返回路径） */
  function resetFilter() {
    filterType = "all";
    activeId = null;
    renderFilters(); renderMap(); renderTimeline();
  }
  function toggleCard(head) {
    const card = head.closest(".fold-card");
    const fold = card.querySelector(".fold");
    const stateEl = head.querySelector(".fold-state");
    const opening = !card.classList.contains("open");
    card.classList.toggle("open", opening);
    fold.style.maxHeight = opening ? fold.scrollHeight + "px" : "0px";
    stateEl.textContent = opening ? "已展开" : "已收起";
    head.setAttribute("aria-expanded", opening);
  }
  function keyCard(e, head) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleCard(head); }
  }

  /* ================= 筛选 ================= */
  function renderFilters() {
    const box = document.getElementById("filters");
    const opts = [["all", "全部"]].concat(Object.keys(TYPE_META).map(t => [t, TYPE_META[t].label]));
    box.innerHTML = '<span class="lbl">行迹筛选</span>' + opts.map(([v, label]) =>
      '<button class="chip' + (filterType === v ? " on" : "") + '" data-v="' + v + '">' + label + '</button>'
    ).join("");
    box.querySelectorAll(".chip").forEach(c =>
      c.addEventListener("click", () => {
        filterType = c.dataset.v;
        activeId = null;
        renderFilters(); renderMap(); renderTimeline();
      }));
  }

  /* ================= 启动 ================= */
  fetch("data/su_shi.json")
    .then(r => r.json())
    .then(d => {
      DATA = d.poets[0];   // 结构预留多诗人：d.poets 数组可直接扩展
      document.title = "诗人足迹 · " + DATA.name + "｜诗迹山河";
      renderHead(DATA);
      renderFilters();
      renderMap();
      renderTimeline();
    })
    .catch(e => {
      document.getElementById("timeline").innerHTML =
        '<div class="empty">足迹长卷未能展开：' + esc(e.message) + '<br>请确认通过 http://localhost:8080 访问（非本地文件打开）<br><a href="javascript:location.reload()" style="display:inline-block;margin-top:12px;padding:8px 24px;font-family:\'STKaiti\',\'KaiTi\',\'楷体\',serif;font-size:14px;letter-spacing:2px;color:#fdfbf5;background:#a3402f;border-radius:18px;text-decoration:none;transition:background .2s,transform .2s;" onmouseover="this.style.background=\'#8f3526\';this.style.transform=\'scale(1.05)\'" onmouseout="this.style.background=\'#a3402f\';this.style.transform=\'\'">重试</a></div>';
    });
</script>

<script>
/* ===== 诗人足迹 · 入场动画（宣纸水墨卷版） =====
   宣纸为底：朱日如墨点晕开、三层墨山次第浮现、白雾缭绕、
   孤舟轻晃、飞鸟掠空——八位诗人依古画题款之式登场：
   诗句竖排浓墨逐字晕染、落款小字、朝代朱印钤下；
   末幕苏轼「一蓑烟雨任平生」染朱，卷心题「诗人足迹」钤印收束，
   整卷晕散淡出、展开行迹长卷（白→纸卷的转场即「入卷」）。
   · 点击任意处 / 回车 / ESC / 空格 跳过
   · 系统开启「减弱动态效果」时不播放 */
(function () {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  var POETS = [
    { name: "李白",   dynasty: "唐", verse: "天生我材必有用" },
    { name: "王维",   dynasty: "唐", verse: "明月松间照" },
    { name: "杜甫",   dynasty: "唐", verse: "会当凌绝顶" },
    { name: "白居易", dynasty: "唐", verse: "最爱湖东行不足" },
    { name: "李清照", dynasty: "宋", verse: "生当作人杰" },
    { name: "陆游",   dynasty: "宋", verse: "铁马冰河入梦来" },
    { name: "辛弃疾", dynasty: "宋", verse: "醉里挑灯看剑" },
    { name: "苏轼",   dynasty: "宋", verse: "一蓑烟雨任平生", hero: true }
  ];
  var FRAME_STEP = 0.62;                             // 每幕间隔（秒）
  var TITLE_AT = POETS.length * FRAME_STEP - 0.2;    // 题名登场时刻（秒）
  var DISMISS_AT = (TITLE_AT + 1.7) * 1000;          // 自动收幕（毫秒）

  var intro = document.createElement("div");
  intro.id = "intro";
  intro.setAttribute("aria-hidden", "true");

  /* 云雾（两层，反向缓慢漂移） */
  ["m1", "m2"].forEach(function (c) {
    var m = document.createElement("div");
    m.className = "mist " + c;
    intro.appendChild(m);
  });

  /* 朱红圆日（墨点晕开式登场） */
  var sun = document.createElement("div");
  sun.className = "sun";
  intro.appendChild(sun);

  /* 三层墨山：feTurbulence 位移滤镜做出毛笔枯边，远淡近浓 */
  function mtnSvg(cls, layers) {
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "mtn " + cls);
    svg.setAttribute("viewBox", "0 0 1440 300");
    svg.setAttribute("preserveAspectRatio", "none");
    var html = '<defs><filter id="f-' + cls + '" x="-8%" y="-15%" width="116%" height="130%">'
      + '<feTurbulence type="fractalNoise" baseFrequency="' + layers.bf + '" numOctaves="3" seed="' + layers.seed + '" result="n"/>'
      + '<feDisplacementMap in="SourceGraphic" in2="n" scale="' + layers.scale + '"/>'
      + '<feGaussianBlur stdDeviation="' + layers.blur + '"/>'
      + '</filter></defs>';
    layers.paths.forEach(function (p) {
      html += '<path d="' + p[0] + '" fill="' + p[1] + '" fill-opacity="' + p[2] + '" filter="url(#f-' + cls + ')"/>';
    });
    svg.innerHTML = html;
    return svg;
  }
  intro.appendChild(mtnSvg("m-far", {
    bf: "0.02 0.045", scale: 18, blur: 5, seed: 4,
    paths: [
      ["M0 300 L0 190 Q 180 92 340 176 Q 470 236 620 130 Q 780 30 930 140 Q 1080 232 1230 150 Q 1340 96 1440 150 L 1440 300 Z", "#8fa0a8", "0.34"],
      ["M0 300 L0 226 Q 210 150 400 210 Q 560 252 720 186 Q 900 118 1060 196 Q 1220 258 1440 210 L 1440 300 Z", "#9aa8ad", "0.22"]
    ]
  }));
  intro.appendChild(mtnSvg("m-mid", {
    bf: "0.024 0.05", scale: 22, blur: 2.6, seed: 11,
    paths: [
      ["M0 300 L0 214 Q 150 118 330 192 Q 470 246 640 152 Q 820 58 990 168 Q 1150 252 1310 176 Q 1390 140 1440 168 L 1440 300 Z", "#7d766a", "0.4"]
    ]
  }));
  intro.appendChild(mtnSvg("m-near", {
    bf: "0.03 0.06", scale: 26, blur: 1.2, seed: 21,
    paths: [
      ["M0 300 L0 246 Q 190 170 380 226 Q 560 274 760 200 Q 950 132 1140 214 Q 1300 276 1440 232 L 1440 300 Z", "#464036", "0.55"]
    ]
  }));

  /* 江面孤舟（扁舟一叶，随波轻晃） */
  var boat = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  boat.setAttribute("class", "boat");
  boat.setAttribute("viewBox", "0 0 100 44");
  boat.innerHTML =
    '<path d="M4 38 H 30" stroke="#6f6656" stroke-width="1.2" opacity=".22" stroke-linecap="round"/>'
    + '<path d="M70 38 H 96" stroke="#6f6656" stroke-width="1.2" opacity=".22" stroke-linecap="round"/>'
    + '<path d="M6 26 Q 50 40 94 24 L 84 34 Q 50 44 16 34 Z" fill="#3a3226" fill-opacity=".85"/>'
    + '<path d="M62 25 L 62 9" stroke="#3a3226" stroke-width="2.2" stroke-linecap="round"/>'
    + '<path d="M62 9 Q 73 13 70 24" stroke="#3a3226" stroke-width="1.6" fill="none" stroke-linecap="round"/>';
  intro.appendChild(boat);

  /* 天际飞鸟（淡墨三两，掠过画卷） */
  var birds = document.createElement("div");
  birds.className = "birds";
  ["", "b2", "b3"].forEach(function (c) {
    var b = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    b.setAttribute("class", "bird " + c);
    b.setAttribute("viewBox", "0 0 28 12");
    b.setAttribute("width", "26");
    b.setAttribute("height", "11");
    b.innerHTML = '<path d="M2 10 Q 8 2 14 9 M14 9 Q 20 2 26 10" fill="none" stroke="#55503f" stroke-width="2" stroke-linecap="round"/>';
    birds.appendChild(b);
  });
  intro.appendChild(birds);

  /* 诗人帧：一幕一诗人，右侧竖排题款，交叉淡入淡出 */
  POETS.forEach(function (p, i) {
    var f = document.createElement("div");
    f.className = "frame" + (p.hero ? " hero" : "");
    f.style.animationDelay = (i * FRAME_STEP) + "s";

    /* 落款列：诗人名 + 朝代印（居诗句左） */
    var sig = document.createElement("div");
    sig.className = "sigcol";
    var nm = document.createElement("div");
    nm.className = "pname";
    nm.textContent = p.name;
    nm.style.animationDelay = (i * FRAME_STEP + 0.42) + "s";
    var seal = document.createElement("div");
    seal.className = "seal";
    seal.textContent = p.dynasty;
    seal.style.animationDelay = (i * FRAME_STEP + 0.6) + "s";
    sig.appendChild(nm);
    sig.appendChild(seal);

    /* 诗句：竖排，逐字如落笔晕开 */
    var verse = document.createElement("div");
    verse.className = "verse";
    p.verse.split("").forEach(function (ch, j) {
      var s = document.createElement("span");
      s.className = "ch";
      s.textContent = ch;
      s.style.animationDelay = (i * FRAME_STEP + 0.12 + j * 0.06) + "s";
      verse.appendChild(s);
    });

    f.appendChild(sig);    /* 左：落款 */
    f.appendChild(verse);  /* 右：诗句 */
    intro.appendChild(f);
  });

  /* 卷末题名（含朱印「迹」） */
  var title = document.createElement("div");
  title.id = "introTitle";
  title.style.animationDelay = TITLE_AT + "s";
  title.innerHTML = '<h2>诗人足迹</h2><p>山河为卷 · 足印成诗</p><div class="tseal">迹</div>';
  title.querySelector(".tseal").style.animationDelay = (TITLE_AT + 0.55) + "s";

  var track = document.createElement("div");
  track.id = "introTrack";

  var skip = document.createElement("div");
  skip.id = "introSkip";
  skip.textContent = "轻点任意处 · 展开长卷";

  intro.appendChild(title);
  intro.appendChild(track);
  intro.appendChild(skip);
  document.body.appendChild(intro);

  /* 收幕：手动跳过或到时自动晕散淡出 */
  var closed = false;
  function dismiss() {
    if (closed) return;
    closed = true;
    intro.classList.add("out");
    setTimeout(function () { intro.remove(); }, 1000);
    document.removeEventListener("keydown", onKey);
  }
  function onKey(e) {
    if (e.key === "Escape" || e.key === "Enter" || e.key === " ") dismiss();
  }
  intro.addEventListener("click", dismiss);
  document.addEventListener("keydown", onKey);
  setTimeout(dismiss, DISMISS_AT);
})();
</script>
</body>
</html>
