<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诗迹山河 · 首页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f5f0e6;
    color: #3a3226;
    line-height: 1.8;
  }

  /* ===== 古风装饰：山水 · 日月 · 花鸟 ===== */
  .decor {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .decor svg { position: absolute; }

  /* 飞鸟（宣纸上方，三两成行） */
  .birds {
    top: 180px;
    right: 7%;
    width: 190px;
    height: 80px;
    animation: birdDrift 9s ease-in-out infinite;
  }
  @keyframes birdDrift {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-9px, -6px); }
  }

  /* 页脚：落日 · 远山 · 水波 */
  .foot {
    left: 0; right: 0; bottom: 0;
    width: 100%;
    height: 260px;
  }

  .header h1, .header p, .header .seal { position: relative; z-index: 1; }

  /* 梅花（今日荐诗卡片角落） */
  .plum {
    position: absolute;
    top: -4px; right: -2px;
    width: 92px; height: 92px;
    opacity: 0.55;
    pointer-events: none;
  }

  /* 分隔饰：细线 + 朱红梅花 */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 6px 0 22px;
  }
  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, #d8cdb8, transparent);
  }
  .divider svg { width: 22px; height: 22px; }

  /* ===== 顶部标题（潇湘图卷 + 暖墨压暗 + 朱红印章落款） ===== */
  .header {
    background:
      linear-gradient(180deg, rgba(42,34,22,.18) 0%, rgba(42,34,22,.38) 100%),
      url("assets/xiaoxiang.jpg") center 42% / cover no-repeat #3a3226;
    color: #f5f0e6;
    padding: 34px 20px 28px;
    text-align: center;
    position: relative;
  }
  .header h1 {
    font-family: "STKaiti", "KaiTi", "楷体", serif;
    font-size: 34px;
    font-weight: 500;
    letter-spacing: 10px;
  }
  .header p {
    font-size: 13px;
    opacity: 0.78;
    margin-top: 10px;
    letter-spacing: 4px;
  }
  .header .seal {
    position: absolute;
    right: 26px;
    bottom: 18px;
    width: 34px;
    height: 34px;
    line-height: 34px;
    text-align: center;
    background: #a3402f;
    color: #f5f0e6;
    font-family: "STKaiti", "KaiTi", "楷体", serif;
    font-size: 16px;
    border-radius: 4px;
    transform: rotate(-4deg);
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 22px 16px 100px;
    position: relative;
    z-index: 1;
  }

  /* ===== 首页搜索框（古风：宣纸底 + 暖墨边 + 朱红搜索键） ===== */
  .search-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
  }
  .search-bar input {
    flex: 1;
    min-width: 0;
    padding: 12px 16px;
    font-size: 15px;
    font-family: inherit;
    color: #3a3226;
    background: #fdfbf5;
    border: 1px solid #d8cdb8;
    border-radius: 6px;
    outline: none;
    transition: border-color .2s;
  }
  .search-bar input::placeholder { color: #b5a88c; }
  .search-bar input:focus { border-color: #a3402f; }
  .search-bar button {
    padding: 12px 22px;
    font-size: 15px;
    font-family: "STKaiti", "KaiTi", "楷体", serif;
    letter-spacing: 2px;
    color: #fdfbf5;
    background: #a3402f;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background .2s;
  }
  .search-bar button:hover { background: #8f3526; transform: scale(1.05); }
  .search-bar button:focus-visible {
    outline: 2px solid #a3402f;
    outline-offset: 3px;
  }

  /* ===== 日期栏 ===== */
  .date-bar {
    text-align: center;
    font-size: 13px;
    color: #8a7a5f;
    letter-spacing: 1px;
    margin-bottom: 20px;
  }

  /* ===== 今日荐诗（小卷轴） ===== */
  .daily {
    background: #fdfbf5;
    border: 1px solid #d8cdb8;
    border-radius: 6px;
    padding: 26px 26px 24px;
    margin-bottom: 26px;
    position: relative;
    box-shadow: 0 2px 10px rgba(58,50,38,.05);
    cursor: pointer;
    transition: border-color .2s, box-shadow .2s;
  }
  .daily:hover { border-color: #b9a887; box-shadow: 0 2px 12px rgba(58,50,38,.1); }
  .daily::before {
    content: "";
    position: absolute;
    top: 10px; left: 10px; right: 10px; bottom: 10px;
    border: 1px solid #e2d6bd;
    border-radius: 3px;
    pointer-events: none;
  }
  .daily-badge {
    display: inline-block;
    background: #a3402f;
    color: #fdfbf5;
    font-size: 12px;
    letter-spacing: 3px;
    padding: 3px 14px;
    border-radius: 3px;
    margin-bottom: 16px;
  }
  .daily .d-title {
    font-family: "STKaiti", "KaiTi", "楷体", serif;
    font-size: 26px;
    font-weight: 500;
    text-align: center;
    color: #3a3226;
  }
  .daily .d-lines {
    font-family: "STKaiti", "KaiTi", "楷体", serif;
    font-size: 19px;
    text-align: center;
    color: #4a4033;
    line-height: 2.1;
    margin: 16px 0;
  }
  .daily .d-author {
    text-align: center;
    font-size: 13px;
    color: #8a7a5f;
  }

  /* ===== 区块标题 ===== */
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-head h2 {
    font-family: "STKaiti", "KaiTi", "楷体", serif;
    font-size: 19px;
    font-weight: 500;
    color: #3a3226;
    letter-spacing: 3px;
  }
  .section-head .num {
    font-size: 12px;
    color: #8a7a5f;
  }

  /* ===== 诗词卡片列表 ===== */
  .poem-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .poem-card {
    background: #fdfbf5;
    border: 1px solid #d8cdb8;
    border-radius: 6px;
    padding: 16px 18px 16px 24px;
    cursor: pointer;
    transition: border-color .2s, box-shadow .2s;
    position: relative;
  }
  .poem-card::before {
    content: "";
    position: absolute;
    left: 10px;
    top: 14px;
    bottom: 14px;
    width: 2px;
    background: #a3402f;
    border-radius: 1px;
  }
  .poem-card:hover { border-color: #b9a887; box-shadow: 0 2px 8px rgba(58,50,38,.08); }
  .pc-title {
    font-family: "STKaiti", "KaiTi", "楷体", serif;
    font-size: 18px;
    font-weight: 500;
    color: #3a3226;
  }
  .pc-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  .pc-author { font-size: 13px; color: #5a4f3f; }
  .dynasty-badge {
    font-size: 12px;
    background: #ece4d4;
    color: #6b5d43;
    padding: 1px 8px;
    border-radius: 10px;
  }
  .topic-tag {
    font-size: 12px;
    background: #f0e3d3;
    color: #a3402f;
    padding: 1px 8px;
    border-radius: 10px;
  }
  .pc-line {
    font-family: "STKaiti", "KaiTi", "楷体", serif;
    font-size: 15px;
    color: #6b5f4d;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed #d8cdb8;
  }

  /* ===== 四种状态占位 ===== */
  .state-box {
    text-align: center;
    padding: 48px 20px;
    color: #8a7a5f;
    font-size: 15px;
    line-height: 1.7;
  }
  .state-box.error { color: #a3402f; }
  .state-box .state-icon { font-size: 34px; margin-bottom: 8px; }
  .state-box .btn {
    display: inline-block;
    margin-top: 14px;
    padding: 8px 22px;
    font-size: 14px;
    border: 1px solid #a3402f;
    border-radius: 6px;
    background: #fdfbf5;
    color: #a3402f;
    cursor: pointer;
  }
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid #d8cdb8;
    border-top-color: #a3402f;
    border-radius: 50%;
    margin: 0 auto 12px;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== 状态切换调试按钮 ===== */
  .debug-switch {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 99;
    display: flex;
    gap: 6px;
    background: rgba(58,50,38,.92);
    padding: 8px 10px;
    border-radius: 8px;
  }
  .debug-switch button {
    font-size: 12px;
    padding: 4px 10px;
    border: none;
    border-radius: 6px;
    background: rgba(255,255,255,.15);
    color: #f5f0e6;
    cursor: pointer;
  }
  .debug-switch button.active { background: #fdfbf5; color: #3a3226; }
</style>
</head>
<body>
  <div class="decor" aria-hidden="true">
    <!-- 飞鸟 -->
    <svg class="birds" viewBox="0 0 200 90">
      <path d="M16 34 Q 28 18 40 34 Q 28 27 16 34 Z" fill="#3a3226" opacity="0.32"/>
      <path d="M66 16 Q 74 7 82 16 Q 74 12 66 16 Z" fill="#3a3226" opacity="0.28"/>
      <path d="M120 46 Q 134 30 148 46 Q 134 38 120 46 Z" fill="#3a3226" opacity="0.22"/>
    </svg>

    <!-- 落日 · 远山 · 水波 -->
    <svg class="foot" viewBox="0 0 1440 320" preserveAspectRatio="xMidYMax slice">
      <circle cx="1050" cy="182" r="34" fill="#c98a5a" opacity="0.15"/>
      <path d="M0 240 L160 150 L320 230 L480 120 L660 235 L840 160 L1020 240 L1200 130 L1360 220 L1440 170 L1440 320 L0 320 Z" fill="#3a3226" opacity="0.05"/>
      <path d="M0 270 L200 200 L400 268 L600 180 L800 270 L1000 210 L1200 275 L1440 210 L1440 320 L0 320 Z" fill="#3a3226" opacity="0.08"/>
      <path d="M0 300 L240 250 L480 305 L720 240 L960 305 L1200 255 L1440 300 L1440 320 L0 320 Z" fill="#3a3226" opacity="0.11"/>
      <path d="M0 314 Q 70 306 140 314 T 280 314 T 420 314 T 560 314 T 700 314 T 840 314 T 980 314 T 1120 314 T 1260 314 T 1440 314" fill="none" stroke="#3a3226" stroke-width="1.4" opacity="0.09"/>
      <path d="M0 320 Q 90 313 180 320 T 360 320 T 540 320 T 720 320 T 900 320 T 1080 320 T 1260 320 T 1440 320" fill="none" stroke="#3a3226" stroke-width="1" opacity="0.06"/>
    </svg>
  </div>

  <header class="header">
    <h1>诗迹山河</h1>
    <p>古诗词学习平台 · 地图 + 诗词</p>
    <span class="seal">诗迹</span>
  </header>

  <main class="container">
    <form class="search-bar" onsubmit="return goSearch(event)">
      <input type="text" id="searchInput" placeholder="搜诗人、诗词或词牌名…" autocomplete="off">
      <button type="submit">搜索</button>
    </form>

    <a href="footprints.html" style="display:block;text-align:center;margin:-4px auto 8px;max-width:420px;padding:8px 20px;border:1px solid #c9bda3;border-radius:18px;color:#8a7a5f;font-size:13px;letter-spacing:3px;text-decoration:none;transition:all .2s ease;" onmouseover="this.style.borderColor='#a3402f';this.style.color='#a3402f'" onmouseout="this.style.borderColor='#c9bda3';this.style.color='#8a7a5f'">诗人足迹 · 循东坡一生行迹 · 古地名配今地 →</a>

    <a href="tour.html" style="display:block;text-align:center;margin:0 auto 18px;max-width:420px;padding:8px 20px;border:1px solid #c9bda3;border-radius:18px;color:#8a7a5f;font-size:13px;letter-spacing:3px;text-decoration:none;transition:all .2s ease;" onmouseover="this.style.borderColor='#a3402f';this.style.color='#a3402f'" onmouseout="this.style.borderColor='#c9bda3';this.style.color='#8a7a5f'">沉浸式演示 · 六分钟陪东坡走完一生 ▶</a>

    <div class="date-bar" id="dateBar">……</div>

    <section class="daily" onclick="location.href='detail.html?title=静夜思&from=home'">
      <!-- 红梅枝 -->
      <svg class="plum" viewBox="0 0 120 120" aria-hidden="true">
        <g stroke="#9a8466" stroke-width="2.2" fill="none" stroke-linecap="round">
          <path d="M10 110 Q 34 82 62 66"/>
          <path d="M32 96 Q 44 78 52 64"/>
          <path d="M46 84 Q 56 72 60 58"/>
        </g>
        <g fill="#a3402f">
          <circle cx="62" cy="66" r="4.2"/>
          <circle cx="52" cy="63" r="3.2"/>
          <circle cx="60" cy="56" r="3"/>
        </g>
        <g fill="#3a3226">
          <circle cx="62" cy="66" r="1.5"/>
          <circle cx="52" cy="63" r="1.1"/>
          <circle cx="60" cy="56" r="1"/>
        </g>
        <g fill="#a3402f" opacity="0.7">
          <circle cx="35" cy="93" r="2"/>
          <circle cx="47" cy="81" r="1.8"/>
          <circle cx="55" cy="71" r="1.6"/>
        </g>
      </svg>
      <span class="daily-badge">今日荐诗</span>
      <div class="d-title">静夜思</div>
      <div class="d-lines">床前明月光，疑是地上霜。<br>举头望明月，低头思故乡。</div>
      <div class="d-author">李白 · 唐代</div>
    </section>

    <div class="divider" aria-hidden="true">
      <svg viewBox="0 0 30 30">
        <g fill="#a3402f" opacity="0.85">
          <circle cx="15" cy="8" r="3.4"/>
          <circle cx="8.4" cy="13" r="3.4"/>
          <circle cx="21.6" cy="13" r="3.4"/>
          <circle cx="10.5" cy="20.5" r="3.4"/>
          <circle cx="19.5" cy="20.5" r="3.4"/>
        </g>
        <circle cx="15" cy="15" r="2" fill="#3a3226"/>
      </svg>
    </div>

    <div class="section-head">
      <h2>精选诗词</h2>
      <span class="num" id="listNum"></span>
    </div>

    <div class="poem-list" id="poemList"></div>
    <div class="state-box loading" id="stateBox">正在展开诗卷…</div>
  </main>

  <div class="debug-switch" id="debugSwitch">
    <button data-state="normal" class="active">正常</button>
    <button data-state="empty">空</button>
    <button data-state="error">错误</button>
  </div>

  <script>
    // ===== 0. 首页搜索：跳到查询页并带入关键词 =====
    function goSearch(e) {
      e.preventDefault();
      const kw = document.getElementById("searchInput").value.trim();
      if (!kw) return false;
      location.href = "index.html?keyword=" + encodeURIComponent(kw);
      return false;
    }

    // ===== 1. 日期栏（公历 + 农历，农历日期转中文数字）=====
    function lunarDayText(n) {
      const ones = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
      if (n < 1 || n > 30) return String(n);
      if (n === 10) return "初十";
      if (n < 10) return "初" + ones[n];
      if (n === 20) return "二十";
      if (n === 30) return "三十";
      return ["", "十", "二十"][Math.floor(n / 10)] + ones[n % 10];
    }
    (function setDate() {
      const now = new Date();
      const solar = now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日";
      let lunar = "";
      try {
        const parts = new Intl.DateTimeFormat("zh-CN-u-ca-chinese", { month: "long", day: "numeric" }).formatToParts(now);
        let month = "", day = "";
        for (const p of parts) {
          if (p.type === "month") month = p.value;
          else if (p.type === "day") day = p.value;
        }
        lunar = month + lunarDayText(parseInt(day, 10));
      } catch (e) { lunar = ""; }
      document.getElementById("dateBar").textContent = solar + (lunar ? " · 农历" + lunar : "");
    })();

    // ===== 2. mock 数据（本地假数据，公版名篇）=====
    const MOCK_POEMS = [
      { title: "黄鹤楼送孟浩然之广陵", author: "李白", dynasty: "唐代", line: "故人西辞黄鹤楼，烟花三月下扬州。", tags: ["送别", "长江"] },
      { title: "望岳", author: "杜甫", dynasty: "唐代", line: "会当凌绝顶，一览众山小。", tags: ["山水", "壮志"] },
      { title: "水调歌头·明月几时有", author: "苏轼", dynasty: "宋代", line: "明月几时有，把酒问青天。", tags: ["中秋", "怀人"] },
      { title: "静夜思", author: "李白", dynasty: "唐代", line: "床前明月光，疑是地上霜。", tags: ["思乡", "月亮"] },
      { title: "春晓", author: "孟浩然", dynasty: "唐代", line: "春眠不觉晓，处处闻啼鸟。", tags: ["春天", "田园"] },
      { title: "登鹳雀楼", author: "王之涣", dynasty: "唐代", line: "白日依山尽，黄河入海流。", tags: ["山水", "登高"] },
      { title: "泊秦淮", author: "杜牧", dynasty: "唐代", line: "烟笼寒水月笼沙，夜泊秦淮近酒家。", tags: ["夜景", "怀古"] },
      { title: "念奴娇·赤壁怀古", author: "苏轼", dynasty: "宋代", line: "大江东去，浪淘尽，千古风流人物。", tags: ["怀古", "赤壁"] }
    ];

    // ===== 3. 状态管理与渲染 =====
    const stateBox = document.getElementById("stateBox");
    const poemList = document.getElementById("poemList");
    const listNum = document.getElementById("listNum");
    let currentState = "normal";

    function cardHtml(p) {
      const tags = (p.tags || []).map(function (t) { return '<span class="topic-tag">' + t + '</span>'; }).join("");
      const href = 'detail.html?title=' + encodeURIComponent(p.title) + '&from=home';
      return (
        '<div class="poem-card" onclick="location.href=\'' + href + '\'">' +
          '<div class="pc-title">' + p.title + '</div>' +
          '<div class="pc-meta">' +
            '<span class="pc-author">' + p.author + '</span>' +
            '<span class="dynasty-badge">' + p.dynasty + '</span>' + tags +
          '</div>' +
          '<div class="pc-line">' + p.line + '</div>' +
        '</div>'
      );
    }

    function render() {
      document.querySelectorAll(".debug-switch button").forEach(function (b) {
        b.classList.toggle("active", b.dataset.state === currentState);
      });

      // 非「正常」的三种状态：清空列表，并确保占位框恢复显示
      if (currentState !== "normal") {
        poemList.innerHTML = "";
        listNum.textContent = "";
        stateBox.style.display = "";
      }

      if (currentState === "loading") {
        stateBox.className = "state-box loading";
        stateBox.innerHTML = '<div class="spinner"></div>正在展开诗卷…';
        return;
      }
      if (currentState === "empty") {
        stateBox.className = "state-box";
        stateBox.innerHTML =
          '<div style="width:36px;height:36px;border:2px dashed #c9bda4;border-radius:50%;margin:0 auto 10px;"></div>' +
          '这里还空着<br>还没有精选诗词，去发现吧<br>' +
          '<button class="btn" onclick="setState(\'normal\')">去发现诗词</button>';
        return;
      }
      if (currentState === "error") {
        stateBox.className = "state-box error";
        stateBox.innerHTML =
          '<div style="width:36px;height:36px;line-height:32px;border:2px solid #a3402f;border-radius:50%;margin:0 auto 10px;font-size:22px;font-weight:500;color:#a3402f;">!</div>' +
          '诗卷打不开了<br>网络好像出了点问题，稍后再试<br>' +
          '<button class="btn" onclick="setState(\'normal\')">重试</button>';
        return;
      }
      // normal：渲染诗词卡片列表（此时隐藏占位框）
      stateBox.style.display = "none";
      listNum.textContent = "共 " + MOCK_POEMS.length + " 首";
      poemList.innerHTML = MOCK_POEMS.map(cardHtml).join("");
    }

    function setState(s) {
      currentState = s;
      render();
    }

    // 模拟异步加载：先显示「加载中」，600ms 后再切到目标状态
    function showLoading(cb) {
      setState("loading");
      setTimeout(cb, 600);
    }

    // ===== 4. 状态切换按钮 =====
    document.querySelectorAll(".debug-switch button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const target = btn.dataset.state;
        showLoading(function () { setState(target); });
      });
    });

    // ===== 5. 初始化：模拟首次加载，再展示列表 =====
    showLoading(function () { setState("normal"); });
