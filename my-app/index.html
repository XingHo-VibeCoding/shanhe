<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>诗迹山河 · 诗词查询</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f4eee1;
      color: #3a3226;
      line-height: 1.8;
    }
    .header {
      background:
        linear-gradient(rgba(244,238,225,.76), rgba(244,238,225,.60)),
        url(assets/pic_qljs.jpg) center 30% / cover no-repeat;
      border-bottom: 1px solid #d8cdb8;
      color: #3a3226;
      padding: 44px 20px 40px;
      text-align: center;
    }
    .header h1 {
      font-family: "STKaiti", "KaiTi", "楷体", serif;
      font-size: 30px;
      font-weight: 500;
      letter-spacing: 8px;
      color: #3a3226;
      text-shadow: 0 1px 0 rgba(253,251,245,.8);
    }
    .header p {
      font-size: 13px;
      color: #5a4f3f;
      margin-top: 8px;
      letter-spacing: 2px;
    }
    .header .paint-credit {
      font-size: 11px;
      color: #8a7a5f;
      margin-top: 14px;
      letter-spacing: 1px;
    }
    .site-nav {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .site-nav a {
      padding: 7px 18px;
      border: 1px solid #c9bda3;
      border-radius: 16px;
      color: #5a4f3f;
      font-size: 13px;
      letter-spacing: 2px;
      text-decoration: none;
      background: rgba(253,251,245,.65);
      transition: border-color .2s, color .2s;
    }
    .site-nav a:hover { border-color: #a3402f; color: #a3402f; }
    .site-nav a:focus-visible { outline: 2px solid #a3402f; outline-offset: 2px; }
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      position: relative;
    }
    .search-box input {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      font-family: inherit;
      color: #3a3226;
      background: #fdfbf5;
      border: 1px solid #d8cdb8;
      border-radius: 8px;
      outline: none;
      transition: border-color .2s;
    }
    .search-box input::placeholder { color: #b5a88c; }
    .search-box input:focus {
      border-color: #a3402f;
    }
    .search-box input:focus-visible {
      outline: 2px solid #a3402f;
      outline-offset: 2px;
    }
    .search-box button {
      padding: 12px 22px;
      font-size: 15px;
      font-family: "STKaiti", "KaiTi", "楷体", serif;
      letter-spacing: 2px;
      border: none;
      border-radius: 8px;
      background: #a3402f;
      color: #fdfbf5;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    .search-box button:hover { background: #8f3526; transform: scale(1.05); }
    .search-box button:focus-visible {
      outline: 2px solid #a3402f;
      outline-offset: 3px;
    }
    .suggest-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 4px;
      background: #fdfbf5;
      border: 1px solid #d8cdb8;
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(58,50,38,.10);
      max-height: 320px;
      overflow-y: auto;
      z-index: 100;
      display: none;
    }
    .suggest-item {
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid #ece4d2;
    }
    .suggest-item:last-child { border-bottom: none; }
    .suggest-item:hover,
    .suggest-item.hover { background: #f0e9d8; }
    .suggest-item .si-title { font-size: 15px; color: #3a3226; }
    .suggest-item .si-meta { font-size: 12px; color: #8a7a5f; margin-top: 2px; }
    .hint {
      font-size: 12px;
      color: #8a7a5f;
      margin-bottom: 16px;
    }
    .poet-bio {
      background: #fdfbf5;
      border: 1px solid #d8cdb8;
      border-left: 4px solid #a3402f;
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 18px;
    }
    .poet-bio .bio-name {
      font-family: "STKaiti", "KaiTi", "楷体", serif;
      font-size: 16px;
      font-weight: 500;
      color: #3a3226;
    }
    .poet-bio .bio-text {
      font-size: 13px;
      color: #8a7a5f;
      margin-top: 4px;
    }
    .poem-card {
      background: #fdfbf5;
      border: 1px solid #d8cdb8;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .poem-card h2 {
      font-family: "STKaiti", "KaiTi", "楷体", serif;
      font-size: 19px;
      font-weight: 500;
      margin-bottom: 4px;
      color: #3a3226;
    }
    .poem-meta {
      font-size: 13px;
      color: #8a7a5f;
      margin-bottom: 12px;
    }
    .poem-meta .tag {
      display: inline-block;
      background: #f0e9d8;
      color: #8a7a5f;
      padding: 1px 8px;
      border-radius: 10px;
      margin-left: 6px;
      font-size: 12px;
    }
    .poem-content {
      font-size: 17px;
      white-space: pre-line;
      padding: 12px 0;
      border-top: 1px dashed #d8cdb8;
      border-bottom: 1px dashed #d8cdb8;
      margin-bottom: 12px;
    }
    .section-title {
      font-family: "STKaiti", "KaiTi", "楷体", serif;
      font-size: 14px;
      font-weight: 500;
      color: #5a4f3f;
      margin: 12px 0 4px;
    }
    .translation {
      font-size: 14px;
      color: #5a4f3f;
      white-space: pre-line;
    }
    .annotation {
      font-size: 13px;
      color: #8a7a5f;
      white-space: pre-line;
      border-top: 1px dotted #d8cdb8;
      margin-top: 8px;
      padding-top: 8px;
    }
    .empty {
      text-align: center;
      color: #8a7a5f;
      padding: 40px 0;
      font-size: 15px;
    }
    .retry-btn {
      display: inline-block;
      margin-top: 14px;
      padding: 8px 24px;
      font-family: "STKaiti", "KaiTi", "楷体", serif;
      font-size: 14px;
      letter-spacing: 2px;
      color: #fdfbf5;
      background: #a3402f;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    .retry-btn:hover { background: #8f3526; transform: scale(1.05); }
    .retry-btn:focus-visible { outline: 2px solid #a3402f; outline-offset: 3px; }
    .err-detail { font-size: 12px; color: #8a7a5f; margin-top: 6px; }
    .empty-chips {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      align-items: center;
      font-size: 13px;
      color: #8a7a5f;
    }
    .empty-chips button {
      padding: 6px 16px;
      font-size: 13px;
      color: #5a4f3f;
      background: transparent;
      border: 1px solid #c9bda3;
      border-radius: 14px;
      cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .empty-chips button:hover { border-color: #a3402f; color: #a3402f; }
    .empty-chips button:focus-visible { outline: 2px solid #a3402f; outline-offset: 2px; }
    .count {
      font-size: 13px;
      color: #8a7a5f;
      margin-bottom: 12px;
    }
    .loading {
      text-align: center;
      color: #8a7a5f;
      padding: 40px 0;
      font-size: 15px;
    }
    .error {
      text-align: center;
      color: #a3402f;
      padding: 40px 0;
      font-size: 15px;
    }
    .pager {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
    }
    .pager button {
      padding: 8px 18px;
      font-size: 14px;
      border: 1px solid #d8cdb8;
      border-radius: 8px;
      background: #fdfbf5;
      color: #3a3226;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .pager button:hover:not(:disabled) { border-color: #a3402f; color: #a3402f; }
    .pager button:focus-visible { outline: 2px solid #a3402f; outline-offset: 2px; }
    .pager button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .title-list-head {
      font-family: "STKaiti", "KaiTi", "楷体", serif;
      font-size: 14px;
      color: #5a4f3f;
      font-weight: 500;
      margin-bottom: 10px;
    }
    .title-item {
      background: #fdfbf5;
      border: 1px solid #d8cdb8;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color .2s;
    }
    .title-item:hover { border-color: #c9bda3; }
    .title-item .ti-title {
      font-family: "STKaiti", "KaiTi", "楷体", serif;
      font-size: 16px;
      color: #3a3226;
      font-weight: 500;
    }
    .title-item .ti-meta {
      font-size: 12px;
      color: #8a7a5f;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>诗迹山河</h1>
    <p>古诗词学习平台 · 地图 + 诗词</p>
    <div class="paint-credit">── 画：王希孟《千里江山图》局部 · 北宋 ──</div>
    <nav class="site-nav">
      <a href="home.html">首页</a>
      <a href="footprints.html">诗人足迹</a>
      <a href="tour.html">沉浸演示</a>
    </nav>
  </div>

  <div class="container">
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="输入诗人姓名或诗词名，如：李白、杜甫、静夜思" autocomplete="off" oninput="onInputChange()" onkeydown="onInputKeydown(event)">
      <button onclick="searchPoems(1)">查询</button>
      <div class="suggest-list" id="suggestList"></div>
    </div>
    <div class="hint">提示：输入诗人姓名可列出 TA 的全部作品；输入诗词名（支持联想，如输入「临江仙」自动列出相关篇名）可查找具体诗词。</div>

    <div class="count" id="count"></div>
    <div id="result"></div>
  </div>

  <script>
    // 本地后端地址（密钥在后端，前端看不到）
    const API_BASE = "http://127.0.0.1:5000";

    // 当前搜索状态
    let currentPoet = "";
    let currentPage = 1;
    let totalPages = 1;

    async function searchPoems(page) {
      const keyword = document.getElementById("searchInput").value.trim();
      const result = document.getElementById("result");
      const count = document.getElementById("count");
      count.textContent = "";
      result.innerHTML = '<div class="loading">正在查询诗词库，请稍候…</div>';

      if (!keyword) {
        result.innerHTML = '<div class="empty">请输入诗人姓名或诗词名再查询</div>';
        return;
      }

      currentPoet = keyword;
      currentPage = page || 1;

      try {
        const url = API_BASE + "/search?keyword=" + encodeURIComponent(keyword) + "&page=" + currentPage;
        const resp = await fetch(url);
        const json = await resp.json();

        if (json.ret_code !== "0") {
          result.innerHTML = '<div class="error">' + (json.remark || "查询失败") + '<br><button class="retry-btn" onclick="searchPoems(currentPage || 1)">重试</button></div>';
          return;
        }

        // 若是「同名作品列表」类型（本地索引命中，非正文），走列表渲染
        if (json.match_type === "titles") {
          renderTitleList(json);
          return;
        }

        renderResult(json);
      } catch (e) {
        result.innerHTML = '<div class="error">诗卷暂时打不开——后端服务可能没有启动，请稍后重试。'
          + '<div class="err-detail">（技术信息：' + e.message + '）</div>'
          + '<button class="retry-btn" onclick="searchPoems(currentPage || 1)">重试</button></div>';
      }
    }

    // Day 13：空结果引导——点示例词直接搜
    function fillSearch(kw) {
      document.getElementById("searchInput").value = kw;
      searchPoems(1);
    }

    function renderResult(json) {
      const count = document.getElementById("count");
      const result = document.getElementById("result");
      const list = json.poemInfo || [];
      const allNum = json.allNum || list.length;
      totalPages = json.allPages || 1;

      if (list.length === 0) {
        count.textContent = "";
        result.innerHTML = '<div class="empty">没有找到「' + currentPoet + '」的相关诗词'
          + '<div class="empty-chips">试试这些：<button onclick="fillSearch(\'李白\')">李白</button>'
          + '<button onclick="fillSearch(\'杜甫\')">杜甫</button>'
          + '<button onclick="fillSearch(\'静夜思\')">静夜思</button>'
          + '<button onclick="fillSearch(\'水调歌头\')">水调歌头</button></div></div>';
        return;
      }

      // 诗人简介（如果有）
      let bioHtml = "";
      if (json.poetInfo && json.poetInfo.poet) {
        bioHtml = `
          <div class="poet-bio">
            <div class="bio-name">${json.poetInfo.poet} · ${json.poetInfo.dynasty || ""}</div>
            <div class="bio-text">${json.poetInfo.biography || ""}</div>
          </div>
        `;
      }

      count.textContent = "「" + currentPoet + "」共 " + allNum + " 首作品，当前第 " + currentPage + " / " + totalPages + " 页";

      const cards = list.map(p => {
        const title = p.title || "无题";
        const author = p.poet || "佚名";
        const dynasty = p.dynasty || "未知";

        // 兼容两种数据格式：
        //  1. API 返回：contentlist 是 [{original, translation, annotation}, ...] 逐句结构
        //  2. 本地库返回：content / translation / annotation 是拼接好的整字段
        const contentlist = p.contentlist || [];
        let contentHtml = "";
        let transHtml = "";
        let annHtml = "";

        if (contentlist.length > 0) {
          contentlist.forEach(item => {
            if (item.original) contentHtml += item.original + "\n";
            if (item.translation) transHtml += item.translation + "\n";
            if (item.annotation) annHtml += "○ " + item.annotation + "\n";
          });
        } else {
          // 本地库格式：整字段直接展示
          contentHtml = p.content || "";
          transHtml = p.translation || "";
          annHtml = p.annotation || "";
        }

        if (!contentHtml) contentHtml = "（无内容）";

        return `
          <div class="poem-card">
            <h2>${title}</h2>
            <div class="poem-meta">
              ${author} · ${dynasty}
            </div>
            <div class="poem-content">${escapeHtml(contentHtml)}</div>
            <div class="section-title">译文</div>
            <div class="translation">${escapeHtml(transHtml) || "（暂无译文）"}</div>
            <div class="section-title">注释</div>
            <div class="annotation">${escapeHtml(annHtml) || "（暂无注释）"}</div>
          </div>
        `;
      }).join("");

      // 分页按钮
      let pagerHtml = "";
      if (totalPages > 1) {
        pagerHtml = `
          <div class="pager">
            <button onclick="searchPoems(${currentPage - 1})" ${currentPage <= 1 ? "disabled" : ""}>上一页</button>
            <span>第 ${currentPage} / ${totalPages} 页</span>
            <button onclick="searchPoems(${currentPage + 1})" ${currentPage >= totalPages ? "disabled" : ""}>下一页</button>
          </div>
        `;
      }

      result.innerHTML = bioHtml + cards + pagerHtml;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // 渲染「同名作品列表」（本地索引命中，点某一首再查正文）
    function renderTitleList(json) {
      const count = document.getElementById("count");
      const result = document.getElementById("result");
      const titles = json.titles || [];
      const allNum = json.allNum || titles.length;

      count.textContent = "找到 " + allNum + " 首同名词作，点击查看正文";

      const items = titles.map(t => `
        <div class="title-item" onclick="searchPoemsByTitle('${escapeHtml(t.title).replace(/'/g, "\\'")}')">
          <div class="ti-title">${escapeHtml(t.title)}</div>
          <div class="ti-meta">${escapeHtml(t.poet)} · ${escapeHtml(t.dynasty)}</div>
        </div>
      `).join("");

      result.innerHTML = items;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // 按完整篇名精确查询（点同名列表某一首时调用）
    async function searchPoemsByTitle(title) {
      document.getElementById("searchInput").value = title;
      const result = document.getElementById("result");
      const count = document.getElementById("count");
      count.textContent = "";
      result.innerHTML = '<div class="loading">正在查询诗词库，请稍候…</div>';

      currentPoet = title;
      currentPage = 1;

      try {
        const url = API_BASE + "/search?title=" + encodeURIComponent(title) + "&page=1";
        const resp = await fetch(url);
        const json = await resp.json();
        if (json.ret_code !== "0") {
          result.innerHTML = '<div class="error">' + (json.remark || "查询失败") + '<br><button class="retry-btn" onclick="searchPoemsByTitle(currentPoet)">重试</button></div>';
          return;
        }
        renderResult(json);
      } catch (e) {
        result.innerHTML = '<div class="error">诗卷暂时打不开——后端服务可能没有启动，请稍后重试。'
          + '<div class="err-detail">（技术信息：' + e.message + '）</div>'
          + '<button class="retry-btn" onclick="searchPoemsByTitle(currentPoet)">重试</button></div>';
      }
    }

    // 简单的转义，防止特殊字符破坏页面
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // ========== 标题联想（输入前缀，列出完整篇名） ==========
    let suggestTimer = null;      // 防抖计时器
    let suggestItems = [];        // 当前联想结果
    let suggestIndex = -1;        // 当前高亮项

    // 输入时触发（防抖 200ms）
    function onInputChange() {
      clearTimeout(suggestTimer);
      const kw = document.getElementById("searchInput").value.trim();
      if (!kw) {
        hideSuggest();
        return;
      }
      suggestTimer = setTimeout(() => fetchSuggest(kw), 200);
    }

    // 请求联想接口
    async function fetchSuggest(kw) {
      try {
        const resp = await fetch(API_BASE + "/suggest?q=" + encodeURIComponent(kw));
        const json = await resp.json();
        if (json.ret_code === "0" && json.suggestions && json.suggestions.length > 0) {
          suggestItems = json.suggestions;
          suggestIndex = -1;
          renderSuggest();
        } else {
          hideSuggest();
        }
      } catch (e) {
        // 联想失败不影响主搜索，静默忽略
        hideSuggest();
      }
    }

    // 渲染下拉列表
    function renderSuggest() {
      const box = document.getElementById("suggestList");
      if (!suggestItems.length) {
        hideSuggest();
        return;
      }
      box.innerHTML = suggestItems.map((s, i) => `
        <div class="suggest-item ${i === suggestIndex ? "hover" : ""}"
             onmousedown="pickSuggestion(${i})"
             onmouseenter="suggestIndex=${i}; renderSuggest();">
          <div class="si-title">${escapeHtml(s.title)}</div>
          <div class="si-meta">${escapeHtml(s.poet)} · ${escapeHtml(s.dynasty)}</div>
        </div>
      `).join("");
      box.style.display = "block";
    }

    function hideSuggest() {
      document.getElementById("suggestList").style.display = "none";
      suggestItems = [];
      suggestIndex = -1;
    }

    // 选中某项 → 填入输入框并直接查询
    function pickSuggestion(i) {
      if (i < 0 || i >= suggestItems.length) return;
      const item = suggestItems[i];
      document.getElementById("searchInput").value = item.title;
      hideSuggest();
      searchPoems(1);
    }

    // 键盘操作：上下键切换、回车确认、ESC 收起
    function onInputKeydown(e) {
      const box = document.getElementById("suggestList");
      if (box.style.display !== "block") {
        // 下拉未展开，回车直接查询
        if (e.key === "Enter") searchPoems(1);
        return;
      }
      if (e.key === "ArrowDown") {
        e.preventDefault();
        suggestIndex = (suggestIndex + 1) % suggestItems.length;
        renderSuggest();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        suggestIndex = (suggestIndex - 1 + suggestItems.length) % suggestItems.length;
        renderSuggest();
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (suggestIndex >= 0) {
          pickSuggestion(suggestIndex);
        } else {
          hideSuggest();
          searchPoems(1);
        }
      } else if (e.key === "Escape") {
        hideSuggest();
      }
    }

    // 点击页面其他区域时收起下拉
    document.addEventListener("click", function (e) {
      if (!e.target.closest(".search-box")) {
        hideSuggest();
      }
    });

    // 初始化：若链接带了 keyword 参数（从首页搜索框跳转而来）就自动搜它，否则默认展示李白
    (function init() {
      const params = new URLSearchParams(location.search);
      const kw = params.get("keyword");
      document.getElementById("searchInput").value = kw || "李白";
      searchPoems(1);
    })();
  </script>
</body>
</html>
