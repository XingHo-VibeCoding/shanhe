<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>诗迹山河 · 诗词查询</title>
  <style>
    :root {
      --paper: #EBEFE4;        /* 纸底（微绿沉） */
      --card: #F3F6EF;         /* 卡片纸 */
      --ink: #26333A;          /* 螺子黛墨字（全站统一锚） */
      --ink-soft: #45524A;     /* 次级墨 */
      --ink-faint: #6F7D74;    /* 弱化文字 */
      --placeholder: #8B988E;  /* 输入框占位 */
      --line: #BCC9B8;         /* 边框 */
      --line-soft: #CCD9C7;    /* 内框/虚线 */
      --tint: #DEE7D6;         /* 徽章底（绿染） */
      --primary: #35603A;      /* 主色·深（官绿，白字对比 6.8:1） */
      --primary-deep: #2B4F30; /* 主色·hover */
      --primary-soft: #7C9A6E; /* 主色·浅（青枫，装饰） */
      --hover: #AABB9F;        /* hover 边框 */
      --seal: #8C2F38;         /* 朱砂（全站点睛，固定） */
      --gold: #B3925B;         /* 金线（全站边饰，固定） */
    }

    /* 跨文档视图过渡：页面切换淡入淡出（Chrome/Edge 126+） */
    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: vtOut .28s ease both; }
    ::view-transition-new(root) { animation: vtIn .36s ease both; }
    @keyframes vtOut { to { opacity: 0; } }
    @keyframes vtIn { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
      background:
        radial-gradient(640px 420px at 12% 6%, rgba(110, 138, 98, .14), transparent 62%),
        radial-gradient(520px 400px at 90% 90%, rgba(43, 79, 48, .11), transparent 60%),
        var(--paper);
      color: var(--ink);
      line-height: 1.8;
      min-height: 100vh;
      animation: pageIn .4s ease both;
    }
    @keyframes pageIn { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      body { animation: none; }
    }
    .header {
      background:
        linear-gradient(rgba(235,239,228,.78), rgba(235,239,228,.62)),
        url(assets/pic_qljs.jpg) center 30% / cover no-repeat;
      border-bottom: 1px solid var(--gold);
      color: var(--ink);
      padding: 44px 20px 40px;
      text-align: center;
    }
    .header h1 {
      font-family: "STKaiti", "KaiTi", "楷体", serif;
      font-size: 30px;
      font-weight: 500;
      letter-spacing: 8px;
      color: var(--ink);
      text-shadow: 0 1px 0 rgba(243,246,239,.8);
    }
    .header p {
      font-size: 13px;
      color: var(--ink-soft);
      margin-top: 8px;
      letter-spacing: 2px;
    }
    .header .paint-credit {
      font-size: 11px;
      color: var(--ink-faint);
      margin-top: 14px;
      letter-spacing: 1px;
    }
    .site-nav {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .site-nav a {
      padding: 7px 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      color: var(--ink-soft);
      font-size: 13px;
      letter-spacing: 2px;
      text-decoration: none;
      background: rgba(243,246,239,.65);
      transition: border-color .2s, color .2s;
    }
    .site-nav a:hover { border-color: var(--primary); color: var(--primary); }
    .site-nav a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      position: relative;
    }
    .search-box input {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      font-family: inherit;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      transition: border-color .2s;
    }
    .search-box input::placeholder { color: var(--placeholder); }
    .search-box input:focus {
      border-color: var(--primary);
    }
    .search-box input:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    .search-box button {
      padding: 12px 22px;
      font-size: 15px;
      font-family: "STKaiti", "KaiTi", "楷体", serif;
      letter-spacing: 2px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: var(--card);
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    .search-box button:hover { background: var(--primary-deep); transform: scale(1.05); }
    .search-box button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }
    .suggest-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 4px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(38,51,58,.12);
      max-height: 320px;
      overflow-y: auto;
      z-index: 100;
      display: none;
    }
    .suggest-item {
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid var(--line-soft);
    }
    .suggest-item:last-child { border-bottom: none; }
    .suggest-item:hover,
    .suggest-item.hover { background: var(--tint); }
    .suggest-item .si-title { font-size: 15px; color: var(--ink); }
    .suggest-item .si-meta { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }
    .si-badge {
      display: inline-block; margin-left: 6px; vertical-align: 1px;
      font-size: 11px; letter-spacing: 1px; line-height: 1;
      color: var(--primary); border: 1px solid var(--primary-soft);
      background: var(--tint); border-radius: 8px; padding: 2px 7px;
    }
    .hint {
      font-size: 12px;
      color: var(--ink-faint);
      margin-bottom: 16px;
    }
    .poet-bio {
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 18px;
    }
    .poet-bio .bio-name {
      font-family: "STKaiti", "KaiTi", "楷体", serif;
      font-size: 16px;
      font-weight: 500;
      color: var(--ink);
    }
    .poet-bio .bio-text {
      font-size: 13px;
      color: var(--ink-faint);
      margin-top: 4px;
    }
    .poem-card {
      background: linear-gradient(180deg, #F6F8F1 0%, var(--card) 42%);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .poem-card h2 {
      font-family: "STKaiti", "KaiTi", "楷体", serif;
      font-size: 19px;
      font-weight: 500;
      margin-bottom: 4px;
      color: var(--ink);
    }
    .poem-meta {
      font-size: 13px;
      color: var(--ink-faint);
      margin-bottom: 12px;
    }
    .poem-meta .tag {
      display: inline-block;
      background: var(--tint);
      color: var(--ink-faint);
      padding: 1px 8px;
      border-radius: 10px;
      margin-left: 6px;
      font-size: 12px;
    }
    .poem-content {
      font-size: 17px;
      white-space: pre-line;
      padding: 12px 0;
      border-top: 1px dashed var(--line-soft);
      border-bottom: 1px dashed var(--line-soft);
      margin-bottom: 12px;
    }
    .section-title {
      font-family: "STKaiti", "KaiTi", "楷体", serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-soft);
      margin: 12px 0 4px;
    }
    .translation {
      font-size: 14px;
      color: var(--ink-soft);
      white-space: pre-line;
    }
    .annotation {
      font-size: 13px;
      color: var(--ink-faint);
      white-space: pre-line;
      border-top: 1px dotted var(--line-soft);
      margin-top: 8px;
      padding-top: 8px;
    }
    .empty {
      text-align: center;
      color: var(--ink-faint);
      padding: 40px 0;
      font-size: 15px;
    }
    .retry-btn {
      display: inline-block;
      margin-top: 14px;
      padding: 8px 24px;
      font-family: "STKaiti", "KaiTi", "楷体", serif;
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--card);
      background: var(--primary);
      border: none;
      border-radius: 18px;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    .retry-btn:hover { background: var(--primary-deep); transform: scale(1.05); }
    .retry-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    .err-detail { font-size: 12px; color: var(--ink-faint); margin-top: 6px; }
    .empty-chips {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      align-items: center;
      font-size: 13px;
      color: var(--ink-faint);
    }
    .empty-chips button {
      padding: 6px 16px;
      font-size: 13px;
      color: var(--ink-soft);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 14px;
      cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .empty-chips button:hover { border-color: var(--primary); color: var(--primary); }
    .empty-chips button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    /* 结果区顶部「相关诗人」延伸条 */
    .poet-extend {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      margin: 0 0 18px; padding: 12px 16px;
      background: var(--tint);
      border: 1px solid var(--line); border-radius: 8px;
    }
    .poet-extend .pe-label { font-size: 12px; letter-spacing: 2px; color: var(--ink-faint); margin-right: 4px; }
    .poet-extend button {
      padding: 6px 14px; font-size: 13px; font-family: inherit;
      color: var(--primary); background: transparent;
      border: 1px solid var(--primary-soft); border-radius: 14px;
      cursor: pointer; transition: border-color .2s, background .2s;
    }
    .poet-extend button:hover { background: var(--card); border-color: var(--primary); }
    .poet-extend button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .poet-extend .pc-cnt { margin-left: 6px; font-size: 11px; color: var(--ink-faint); }

    /* ===== 关键词标红：诗名/作者/诗句命中处用朱砂 ===== */
    .kw-hl { background: none; color: var(--seal); font-weight: 700; padding: 0; font-style: normal; }

    /* ===== 搜索历史条（搜索栏下方，样式与相关诗人条同源）===== */
    .history-strip {
      display: none; flex-wrap: wrap; align-items: center; gap: 8px;
      margin: -2px 0 14px;
    }
    .hist-label { font-size: 12px; letter-spacing: 2px; color: var(--ink-faint); }
    .hist-chip {
      display: inline-flex; align-items: center;
      background: var(--tint); border: 1px solid var(--line-soft);
      border-radius: 14px; padding: 3px 4px 3px 10px;
    }
    .hist-word { font-size: 13px; color: var(--ink-soft); cursor: pointer; }
    .hist-word:hover { color: var(--primary); }
    .hist-x {
      border: none; background: none; color: var(--ink-faint);
      font-size: 14px; line-height: 1; padding: 2px 5px; cursor: pointer; border-radius: 50%;
    }
    .hist-x:hover { color: var(--seal); }
    .hist-x:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
    .hist-clear {
      border: none; background: none; font-size: 12px; color: var(--ink-faint);
      text-decoration: underline; cursor: pointer; padding: 2px 4px;
    }
    .hist-clear:hover { color: var(--seal); }

    /* ===== 手机端独立搜索页：整屏搜索面板（输入 + 联想 + 历史）===== */
    .search-back { display: none; }
    @media (max-width: 768px) {
      .search-panel.search-open {
        position: fixed; inset: 0; z-index: 200;
        background: var(--paper);
        padding: 10px 14px 24px;
        overflow-y: auto;
      }
      .search-panel.search-open .search-back {
        display: inline-flex; align-items: center; gap: 5px;
        border: none; background: none; color: var(--ink-soft);
        font-size: 14px; font-family: inherit; padding: 6px 2px 12px; cursor: pointer;
      }
      .search-panel.search-open .search-back:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    }
    .count {
      font-size: 13px;
      color: var(--ink-faint);
      margin-bottom: 12px;
    }
    .loading {
      text-align: center;
      color: var(--ink-faint);
      padding: 40px 0;
      font-size: 15px;
    }
    .error {
      text-align: center;
      color: var(--seal);
      padding: 40px 0;
      font-size: 15px;
    }
    .pager {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
    }
    .pager button {
      padding: 8px 18px;
      font-size: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .pager button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .pager button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .pager button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .title-list-head {
      font-family: "STKaiti", "KaiTi", "楷体", serif;
      font-size: 14px;
      color: var(--ink-soft);
      font-weight: 500;
      margin-bottom: 10px;
    }
    .recommend-head {
      font-family: "STKaiti", "KaiTi", "楷体", serif;
      font-size: 17px;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: 4px;
      margin: 6px 0 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .recommend-head::before,
    .recommend-head::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--gold);
      opacity: .55;
    }
    .poem-card h2 a {
      color: var(--ink);
      text-decoration: none;
      transition: color .2s;
    }
    .poem-card h2 a:hover { color: var(--primary); }
    .title-item {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color .2s;
    }
    .title-item:hover { border-color: var(--hover); }
    .title-item .ti-title {
      font-family: "STKaiti", "KaiTi", "楷体", serif;
      font-size: 16px;
      color: var(--ink);
      font-weight: 500;
    }
    .title-item .ti-meta {
      font-size: 12px;
      color: var(--ink-faint);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>诗迹山河</h1>
    <p>古诗词学习平台 · 地图 + 诗词</p>
    <div class="paint-credit">── 画：王希孟《千里江山图》局部 · 北宋 ──</div>
    <nav class="site-nav">
      <a href="home.html">首页</a>
      <a href="footprints.html">诗人足迹</a>
    </nav>
  </div>

  <div class="container">
    <div class="search-panel" id="searchPanel">
      <button class="search-back" id="searchBack" onclick="closeSearchMode()" aria-label="返回结果">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        返回
      </button>
      <div class="search-box">
        <input id="searchInput" type="text" placeholder="输入诗人姓名或诗词名，如：李白、杜甫、静夜思" autocomplete="off" onfocus="openSearchMode()" oninput="onInputChange()" oncompositionend="onInputChange()" onkeydown="onInputKeydown(event)">
        <button id="searchBtn" onclick="searchPoems(1)">查询</button>
        <div class="suggest-list" id="suggestList"></div>
      </div>
      <div class="history-strip" id="historyStrip"></div>
    </div>
    <div class="hint">提示：输入诗人姓名可列出 TA 的全部作品；输入诗词名（支持联想，如输入「临江仙」自动列出相关篇名）可查找具体诗词。</div>

    <div class="count" id="count"></div>
    <div id="result"></div>
  </div>

  <script>
    // 后端地址：留空走同源相对路径（本地/线上部署都通），密钥在后端，前端看不到
    // 后端地址自适应：本站若部署在腾讯云静态托管（无 Flask），跨域调用发布在 workbuddy.host 的后端
    const API_BASE = location.hostname.includes("tcloudbaseapp.com")
      ? "https://shiji-shanhe.app.workbuddy.host"
      : "";

    // 当前搜索状态
    let currentPoet = "";
    /* 把浏览器/接口的裸报错转成用户能懂的中文；技术原文只进 Console */
    function friendlyError(e) {
      console.error("请求失败详情：", e);
      var msg = (e && e.message) ? String(e.message) : String(e);
      if (/failed to fetch|networkerror|load failed|timed? ?out/i.test(msg)) return "网络连接失败，请检查网络或稍后重试";
      if (/40[13]/.test(msg)) return "服务暂时无法访问，请稍后重试";
      if (/^5\d\d|bad gateway|service unavailable/i.test(msg)) return "服务器开小差了，请稍后重试";
      return "出了点小问题，请稍后重试";
    }
    /* 网络瞬断自动重试一次（Day 24）：首次失败后隔 800ms 再试，仍失败才抛给 friendlyError */
    function fetchRetry(url, opts) {
      return fetch(url, opts).catch(function (e) {
        console.warn("首次请求失败，800ms 后自动重试：", url);
        return new Promise(function (resolve, reject) {
          setTimeout(function () { fetch(url, opts).then(resolve, reject); }, 800);
        });
      });
    }

    let currentPage = 1;
    let totalPages = 1;

    async function searchPoems(page) {
      const keyword = document.getElementById("searchInput").value.trim();
      const result = document.getElementById("result");
      const count = document.getElementById("count");
      count.textContent = "";
      result.innerHTML = '<div class="loading">正在查询诗词库，请稍候…</div>';

      if (!keyword) {
        // 无输入 → 展示推荐诗词
        loadRecommendations();
        return;
      }

      currentPoet = keyword;
      currentPage = page || 1;
      hideSuggest();  // 发起搜索即收起联想下拉，避免盖住结果区
      closeSearchMode();  // 手机端整屏搜索页随之收起，露出结果区
      if (currentPage === 1) saveHistory(keyword);  // 仅首次搜索记入历史，翻页不记

      try {
        const url = API_BASE + "/search?keyword=" + encodeURIComponent(keyword) + "&page=" + currentPage;
        const resp = await fetchRetry(url);
        const json = await resp.json();

        if (json.ret_code !== "0") {
          result.innerHTML = '<div class="error">' + (json.remark || "查询失败") + '<br><button class="retry-btn" onclick="searchPoems(currentPage || 1)">重试</button></div>';
          return;
        }

        // 若是「同名作品列表」类型（本地索引命中，非正文），走列表渲染
        if (json.match_type === "titles") {
          renderTitleList(json);
          showPoetExtend(keyword);
          return;
        }

        renderResult(json);
        showPoetExtend(keyword);
      } catch (e) {
        result.innerHTML = '<div class="error">诗卷暂时打不开——后端服务可能没有启动，请稍后重试。'
          + '<div class="err-detail">（' + friendlyError(e) + '）</div>'
          + '<button class="retry-btn" onclick="searchPoems(currentPage || 1)">重试</button></div>';
      }
    }

    // Day 13：空结果引导——点示例词直接搜
    function fillSearch(kw) {
      document.getElementById("searchInput").value = kw;
      searchPoems(1);
    }

    // ========== 结果区「相关诗人」延伸条 ==========
    // 搜「李」等宽泛词时，在结果顶部给出同名/近名诗人入口，点击即列出 TA 的全部作品
    window._poetEx = [];  // 延伸条诗人名缓存（供按钮 onclick 按下标取用，避免引号转义问题）
    async function showPoetExtend(keyword) {
      const result = document.getElementById("result");
      try {
        const resp = await fetchRetry(API_BASE + "/suggest?q=" + encodeURIComponent(keyword));
        const json = await resp.json();
        if (json.ret_code !== "0") return;
        // 过滤：只要诗人项；与当前关键词完全相同的不再重复给（搜"李白"时结果已是李白全集）
        const poets = (json.suggestions || []).filter(s => s.is_poet && s.title !== keyword);
        if (!poets.length) return;
        // 输入框已被改掉（用户连搜）→ 本次延伸作废，防止插错位置
        if (document.getElementById("searchInput").value.trim() !== keyword) return;
        window._poetEx = poets.slice(0, 8).map(s => s.title);
        const chips = poets.slice(0, 8).map((s, i) =>
          '<button onclick="fillSearch(_poetEx[' + i + '])">' +
          escapeHtml(s.title) + '<span class="pc-cnt">' + escapeHtml(s.poet) + '</span></button>'
        ).join("");
        result.insertAdjacentHTML("afterbegin",
          '<div class="poet-extend"><span class="pe-label">相关诗人</span>' + chips + '</div>');
      } catch (e) {
        // 延伸失败不影响主结果，静默忽略
      }
    }

    // ========== 推荐诗词（无输入时展示本地名篇） ==========
    async function loadRecommendations() {
      const result = document.getElementById("result");
      const count = document.getElementById("count");
      count.textContent = "";
      result.innerHTML = '<div class="loading">正在挑选名篇，请稍候…</div>';
      currentPoet = "";
      currentPage = 1;
      totalPages = 1;

      try {
        const resp = await fetchRetry(API_BASE + "/recommend");
        const json = await resp.json();
        if (json.ret_code !== "0" || !(json.poemInfo || []).length) {
          result.innerHTML = '<div class="empty">推荐暂不可用，输入诗人姓名或诗词名开始查询</div>';
          return;
        }
        renderRecommendations(json.poemInfo);
      } catch (e) {
        result.innerHTML = '<div class="error">推荐暂时取不到——后端服务可能没有启动。'
          + '<div class="err-detail">（' + friendlyError(e) + '）</div>'
          + '<button class="retry-btn" onclick="loadRecommendations()">重试</button></div>';
      }
    }

    function renderRecommendations(list) {
      const result = document.getElementById("result");
      const cards = list.map(p => {
        const title = p.title || "无题";
        const author = poetName(p.poet);
        const dynasty = p.dynasty || "未知";
        const contentHtml = p.content || "（无内容）";
        const transHtml = p.translation || "";
        const annHtml = p.annotation || "";
        return `
          <div class="poem-card">
            <h2><a href="detail.html?title=${encodeURIComponent(title)}">${escapeHtml(title)}</a></h2>
            <div class="poem-meta">${escapeHtml(author)} · ${escapeHtml(dynasty)}</div>
            <div class="poem-content">${escapeHtml(contentHtml)}</div>
            <div class="section-title">译文</div>
            <div class="translation">${escapeHtml(transHtml) || "（暂无译文）"}</div>
            <div class="section-title">注释</div>
            <div class="annotation">${escapeHtml(annHtml) || "（暂无注释）"}</div>
          </div>
        `;
      }).join("");
      result.innerHTML = '<div class="recommend-head">推 荐 诗 词</div>' + cards;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderResult(json) {
      const count = document.getElementById("count");
      const result = document.getElementById("result");
      const list = json.poemInfo || [];
      const allNum = json.allNum || list.length;
      totalPages = json.allPages || 1;

      if (list.length === 0) {
        count.textContent = "";
        result.innerHTML = '<div class="empty">没有找到「' + currentPoet + '」的相关诗词'
          + '<div class="empty-chips">试试这些：<button onclick="fillSearch(\'李白\')">李白</button>'
          + '<button onclick="fillSearch(\'杜甫\')">杜甫</button>'
          + '<button onclick="fillSearch(\'静夜思\')">静夜思</button>'
          + '<button onclick="fillSearch(\'水调歌头\')">水调歌头</button></div></div>';
        return;
      }

      // 诗人简介（如果有）
      let bioHtml = "";
      if (json.poetInfo && json.poetInfo.poet) {
        bioHtml = `
          <div class="poet-bio">
            <div class="bio-name">${hl(json.poetInfo.poet, currentPoet)} · ${json.poetInfo.dynasty || ""}</div>
            <div class="bio-text">${json.poetInfo.biography || ""}</div>
          </div>
        `;
      }

      count.textContent = "「" + currentPoet + "」共 " + allNum + " 首作品，当前第 " + currentPage + " / " + totalPages + " 页";

      const cards = list.map(p => {
        const title = p.title || "无题";
        // 作者名兜底：空名 / 单字残名（如「李」）/ 带占位符的脏名 一律显示「佚名」
        const author = poetName(p.poet);
        const dynasty = p.dynasty || "未知";

        // 兼容两种数据格式：
        //  1. API 返回：contentlist 是 [{original, translation, annotation}, ...] 逐句结构
        //  2. 本地库返回：content / translation / annotation 是拼接好的整字段
        const contentlist = p.contentlist || [];
        let contentHtml = "";
        let transHtml = "";
        let annHtml = "";

        if (contentlist.length > 0) {
          contentlist.forEach(item => {
            if (item.original) contentHtml += item.original + "\n";
            if (item.translation) transHtml += item.translation + "\n";
            if (item.annotation) annHtml += "○ " + item.annotation + "\n";
          });
        } else {
          // 本地库格式：整字段直接展示
          contentHtml = p.content || "";
          transHtml = p.translation || "";
          annHtml = p.annotation || "";
        }

        if (!contentHtml) contentHtml = "（无内容）";

        return `
          <div class="poem-card">
            <h2>${hl(title, currentPoet)}</h2>
            <div class="poem-meta">
              ${hl(author, currentPoet)} · ${hl(dynasty, currentPoet)}
            </div>
            <div class="poem-content">${hl(contentHtml, currentPoet)}</div>
            <div class="section-title">译文</div>
            <div class="translation">${escapeHtml(transHtml) || "（暂无译文）"}</div>
            <div class="section-title">注释</div>
            <div class="annotation">${escapeHtml(annHtml) || "（暂无注释）"}</div>
          </div>
        `;
      }).join("");

      // 分页按钮
      let pagerHtml = "";
      if (totalPages > 1) {
        pagerHtml = `
          <div class="pager">
            <button onclick="searchPoems(${currentPage - 1})" ${currentPage <= 1 ? "disabled" : ""}>上一页</button>
            <span>第 ${currentPage} / ${totalPages} 页</span>
            <button onclick="searchPoems(${currentPage + 1})" ${currentPage >= totalPages ? "disabled" : ""}>下一页</button>
          </div>
        `;
      }

      result.innerHTML = bioHtml + cards + pagerHtml;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // 渲染「同名作品列表」（本地索引命中，点某一首再查正文）
    function renderTitleList(json) {
      const count = document.getElementById("count");
      const result = document.getElementById("result");
      const titles = json.titles || [];
      const allNum = json.allNum || titles.length;

      count.textContent = "找到 " + allNum + " 首同名词作，点击查看正文";

      const items = titles.map(t => `
        <div class="title-item" onclick="searchPoemsByTitle('${escapeHtml(t.title).replace(/'/g, "\\'")}')">
          <div class="ti-title">${hl(t.title, currentPoet)}</div>
          <div class="ti-meta">${hl(poetName(t.poet), currentPoet)} · ${hl(t.dynasty, currentPoet)}</div>
        </div>
      `).join("");

      result.innerHTML = items;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // 按完整篇名精确查询（点同名列表某一首时调用）
    async function searchPoemsByTitle(title) {
      document.getElementById("searchInput").value = title;
      const result = document.getElementById("result");
      const count = document.getElementById("count");
      count.textContent = "";
      result.innerHTML = '<div class="loading">正在查询诗词库，请稍候…</div>';

      currentPoet = title;
      currentPage = 1;

      try {
        const url = API_BASE + "/search?title=" + encodeURIComponent(title) + "&page=1";
        const resp = await fetchRetry(url);
        const json = await resp.json();
        if (json.ret_code !== "0") {
          result.innerHTML = '<div class="error">' + (json.remark || "查询失败") + '<br><button class="retry-btn" onclick="searchPoemsByTitle(currentPoet)">重试</button></div>';
          return;
        }
        renderResult(json);
      } catch (e) {
        result.innerHTML = '<div class="error">诗卷暂时打不开——后端服务可能没有启动，请稍后重试。'
          + '<div class="err-detail">（' + friendlyError(e) + '）</div>'
          + '<button class="retry-btn" onclick="searchPoemsByTitle(currentPoet)">重试</button></div>';
      }
    }

    // 简单的转义，防止特殊字符破坏页面
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    /* ===== 作者名清洗：空名 / 被截断的单字姓氏（如「李」）/ 带占位符的脏名 一律显示「佚名」 ===== */
    function poetName(raw) {
      const s = String(raw == null ? "" : raw).replace(/[\s\u3000]/g, "");
      if (s.length <= 1 || /[□▢▣�?？*＊]/.test(s)) return "佚名";
      return s;
    }

    /* ===== 关键词标红：先转义再包朱砂 mark，正则元字符也做安全处理 ===== */
    function hl(text, kw) {
      const esc = escapeHtml(text == null ? "" : text);
      const k = (kw == null ? "" : String(kw)).trim();
      if (!k) return esc;
      const kEsc = escapeHtml(k);
      try {
        const re = new RegExp(kEsc.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g");
        return esc.replace(re, '<mark class="kw-hl">' + kEsc + "</mark>");
      } catch (err) {
        return esc;
      }
    }

    /* ===== 搜索历史：浏览器本地保存，最多 10 条，可单删/清空/点击重搜 ===== */
    const HIST_KEY = "shiji_search_history";
    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch (e) { return []; }
    }
    function saveHistory(kw) {
      kw = (kw || "").trim();
      if (!kw) return;
      let h = loadHistory().filter(x => x !== kw);
      h.unshift(kw);
      h = h.slice(0, 10);
      try { localStorage.setItem(HIST_KEY, JSON.stringify(h)); } catch (e) {}
      renderHistory();
    }
    function removeHistory(kw) {
      const h = loadHistory().filter(x => x !== kw);
      try { localStorage.setItem(HIST_KEY, JSON.stringify(h)); } catch (e) {}
      renderHistory();
    }
    function clearHistory() {
      try { localStorage.removeItem(HIST_KEY); } catch (e) {}
      renderHistory();
    }
    window._hist = [];  // 历史词暂存，onclick 按下标取，避免引号转义问题
    function histGo(i) { fillSearch(window._hist[i]); }
    function renderHistory() {
      const box = document.getElementById("historyStrip");
      if (!box) return;
      const h = loadHistory();
      window._hist = h;
      if (!h.length) { box.style.display = "none"; box.innerHTML = ""; return; }
      box.style.display = "flex";
      box.innerHTML = '<span class="hist-label">搜索历史</span>'
        + h.map((kw, i) =>
          '<span class="hist-chip">'
          + '<span class="hist-word" onclick="histGo(' + i + ')" title="点击重新搜索">' + escapeHtml(kw) + '</span>'
          + '<button class="hist-x" onclick="removeHistory(window._hist[' + i + '])" aria-label="删除 ' + escapeHtml(kw) + '">×</button>'
          + '</span>'
        ).join("")
        + '<button class="hist-clear" onclick="clearHistory()">清空</button>';
    }

    /* ===== 手机端独立搜索页：聚焦输入时整屏展开（输入+联想+历史），搜索/返回时收起 ===== */
    const mqMobile = window.matchMedia("(max-width: 768px)");
    function openSearchMode() {
      if (!mqMobile.matches) return;  // 桌面端不启用整屏模式
      document.getElementById("searchPanel").classList.add("search-open");
      document.body.style.overflow = "hidden";
      renderHistory();
    }
    function closeSearchMode() {
      const p = document.getElementById("searchPanel");
      if (p) p.classList.remove("search-open");
      document.body.style.overflow = "";
    }

    // ========== 标题联想（输入前缀，列出完整篇名） ==========
    let suggestTimer = null;      // 防抖计时器
    let suggestItems = [];        // 当前联想结果
    let suggestIndex = -1;        // 当前高亮项

    // 输入时触发（防抖 200ms）
    function onInputChange() {
      clearTimeout(suggestTimer);
      const kw = document.getElementById("searchInput").value.trim();
      if (!kw) {
        hideSuggest();
        return;
      }
      suggestTimer = setTimeout(() => fetchSuggest(kw), 200);
    }

    // 请求联想接口（带代数号：hideSuggest/新搜索会使在途响应作废，防止迟到的联想盖住结果区）
    let suggestGen = 0;
    async function fetchSuggest(kw) {
      const gen = suggestGen;
      try {
        const resp = await fetchRetry(API_BASE + "/suggest?q=" + encodeURIComponent(kw));
        const json = await resp.json();
        if (gen !== suggestGen) return;  // 期间发生过收起/搜索，本次联想作废
        if (json.ret_code === "0" && json.suggestions && json.suggestions.length > 0) {
          suggestItems = json.suggestions;
          suggestIndex = -1;
          renderSuggest();
        } else {
          hideSuggest();
        }
      } catch (e) {
        // 联想失败不影响主搜索，静默忽略
        hideSuggest();
      }
    }

    // 渲染下拉列表
    function renderSuggest() {
      const box = document.getElementById("suggestList");
      if (!suggestItems.length) {
        hideSuggest();
        return;
      }
      box.innerHTML = suggestItems.map((s, i) => `
        <div class="suggest-item ${i === suggestIndex ? "hover" : ""}"
             onclick="pickSuggestion(${i})"
             onmouseenter="suggestIndex=${i}; renderSuggest();">
          <div class="si-title">${escapeHtml(s.title)}${s.is_poet ? '<span class="si-badge">诗人</span>' : ""}</div>
          <div class="si-meta">${escapeHtml(s.poet)} · ${escapeHtml(s.dynasty)}</div>
        </div>
      `).join("");
      box.style.display = "block";
    }

    function hideSuggest() {
      document.getElementById("suggestList").style.display = "none";
      clearTimeout(suggestTimer);  // 取消挂着的联想防抖，防止搜索后又弹出
      suggestGen++;  // 作废所有在途联想响应
      suggestItems = [];
      suggestIndex = -1;
    }

    // 选中某项 → 填入输入框并直接查询
    function pickSuggestion(i) {
      if (i < 0 || i >= suggestItems.length) return;
      const item = suggestItems[i];
      document.getElementById("searchInput").value = item.title;
      hideSuggest();
      searchPoems(1);
    }

    // 键盘操作：上下键切换、回车确认、ESC 收起
    function onInputKeydown(e) {
      const box = document.getElementById("suggestList");
      if (box.style.display !== "block") {
        // 下拉未展开，回车直接查询
        if (e.key === "Enter") searchPoems(1);
        return;
      }
      if (e.key === "ArrowDown") {
        e.preventDefault();
        suggestIndex = (suggestIndex + 1) % suggestItems.length;
        renderSuggest();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        suggestIndex = (suggestIndex - 1 + suggestItems.length) % suggestItems.length;
        renderSuggest();
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (suggestIndex >= 0) {
          pickSuggestion(suggestIndex);
        } else {
          hideSuggest();
          searchPoems(1);
        }
      } else if (e.key === "Escape") {
        hideSuggest();
      }
    }

    // 点击页面其他区域时收起下拉
    document.addEventListener("click", function (e) {
      if (!e.target.closest(".search-box")) {
        hideSuggest();
      }
    });

    // 初始化：若链接带了 keyword 参数（从首页搜索框跳转而来）就自动搜它；
    // 否则保持输入框清空，下方展示推荐诗词
    (function init() {
      renderHistory();  // 打开页面先渲染本地搜索历史
      const params = new URLSearchParams(location.search);
      const kw = (params.get("keyword") || "").trim();
      document.getElementById("searchInput").value = kw;
      if (kw) {
        searchPoems(1);
      } else {
        loadRecommendations();
      }
    })();
  </script>
</body>
</html>
