<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>诗迹山河 · 诗词查询</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f7f5f0;
      color: #333;
      line-height: 1.8;
    }
    .header {
      background: #2c3e50;
      color: #fff;
      padding: 28px 20px;
      text-align: center;
    }
    .header h1 {
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 2px;
    }
    .header p {
      font-size: 13px;
      opacity: 0.75;
      margin-top: 6px;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .search-box input {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }
    .search-box input:focus {
      border-color: #2c3e50;
    }
    .search-box button {
      padding: 12px 22px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      background: #2c3e50;
      color: #fff;
      cursor: pointer;
    }
    .search-box button:hover { background: #1f2d3a; }
    .hint {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 16px;
    }
    .poet-bio {
      background: #fff;
      border: 1px solid #e8e4dc;
      border-left: 4px solid #2c3e50;
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 18px;
    }
    .poet-bio .bio-name {
      font-size: 16px;
      font-weight: 500;
      color: #2c3e50;
    }
    .poet-bio .bio-text {
      font-size: 13px;
      color: #777;
      margin-top: 4px;
    }
    .poem-card {
      background: #fff;
      border: 1px solid #e8e4dc;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .poem-card h2 {
      font-size: 19px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .poem-meta {
      font-size: 13px;
      color: #888;
      margin-bottom: 12px;
    }
    .poem-meta .tag {
      display: inline-block;
      background: #eef2f5;
      color: #2c3e50;
      padding: 1px 8px;
      border-radius: 10px;
      margin-left: 6px;
      font-size: 12px;
    }
    .poem-content {
      font-size: 17px;
      white-space: pre-line;
      padding: 12px 0;
      border-top: 1px dashed #eee;
      border-bottom: 1px dashed #eee;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 500;
      color: #2c3e50;
      margin: 12px 0 4px;
    }
    .translation {
      font-size: 14px;
      color: #555;
      white-space: pre-line;
    }
    .annotation {
      font-size: 13px;
      color: #999;
      white-space: pre-line;
      border-top: 1px dotted #eee;
      margin-top: 8px;
      padding-top: 8px;
    }
    .empty {
      text-align: center;
      color: #999;
      padding: 40px 0;
      font-size: 15px;
    }
    .count {
      font-size: 13px;
      color: #999;
      margin-bottom: 12px;
    }
    .loading {
      text-align: center;
      color: #999;
      padding: 40px 0;
      font-size: 15px;
    }
    .error {
      text-align: center;
      color: #c0392b;
      padding: 40px 0;
      font-size: 15px;
    }
    .pager {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
    }
    .pager button {
      padding: 8px 18px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      color: #2c3e50;
      cursor: pointer;
    }
    .pager button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>诗迹山河</h1>
    <p>古诗词学习平台 · 地图 + 诗词</p>
  </div>

  <div class="container">
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="输入诗人姓名，如：李白、杜甫、苏轼" onkeydown="if(event.key==='Enter') searchPoems(1)">
      <button onclick="searchPoems(1)">查询</button>
    </div>
    <div class="hint">提示：输入诗人姓名，可列出 TA 的全部作品（含原文、译文、注释）。</div>

    <div class="count" id="count"></div>
    <div id="result"></div>
  </div>

  <script>
    // 本地后端地址（密钥在后端，前端看不到）
    const API_BASE = "http://localhost:5000";

    // 当前搜索状态
    let currentPoet = "";
    let currentPage = 1;
    let totalPages = 1;

    async function searchPoems(page) {
      const keyword = document.getElementById("searchInput").value.trim();
      const result = document.getElementById("result");
      const count = document.getElementById("count");
      count.textContent = "";
      result.innerHTML = '<div class="loading">正在查询诗词库，请稍候…</div>';

      if (!keyword) {
        result.innerHTML = '<div class="empty">请输入诗人姓名再查询</div>';
        return;
      }

      currentPoet = keyword;
      currentPage = page || 1;

      try {
        const url = API_BASE + "/search?poet=" + encodeURIComponent(keyword) + "&page=" + currentPage;
        const resp = await fetch(url);
        const json = await resp.json();

        if (json.ret_code !== "0") {
          result.innerHTML = '<div class="error">' + (json.remark || "查询失败") + '</div>';
          return;
        }

        renderResult(json);
      } catch (e) {
        result.innerHTML = '<div class="error">无法连接后端服务。请确认已启动 server.py。<br>（错误：' + e.message + '）</div>';
      }
    }

    function renderResult(json) {
      const count = document.getElementById("count");
      const result = document.getElementById("result");
      const list = json.poemInfo || [];
      const allNum = json.allNum || list.length;
      totalPages = json.allPages || 1;

      if (list.length === 0) {
        count.textContent = "";
        result.innerHTML = '<div class="empty">没有找到「' + currentPoet + '」的诗词，换个诗人试试吧</div>';
        return;
      }

      // 诗人简介（如果有）
      let bioHtml = "";
      if (json.poetInfo && json.poetInfo.poet) {
        bioHtml = `
          <div class="poet-bio">
            <div class="bio-name">${json.poetInfo.poet} · ${json.poetInfo.dynasty || ""}</div>
            <div class="bio-text">${json.poetInfo.biography || ""}</div>
          </div>
        `;
      }

      count.textContent = "「" + currentPoet + "」共 " + allNum + " 首作品，当前第 " + currentPage + " / " + totalPages + " 页";

      const cards = list.map(p => {
        const title = p.title || "无题";
        const author = p.poet || "佚名";
        const dynasty = p.dynasty || "未知";

        // contentlist 是 [{original, translation, annotation}, ...] 结构
        const contentlist = p.contentlist || [];
        let contentHtml = "";
        let transHtml = "";
        let annHtml = "";

        contentlist.forEach(item => {
          if (item.original) contentHtml += item.original + "\n";
          if (item.translation) transHtml += item.translation + "\n";
          if (item.annotation) annHtml += "○ " + item.annotation + "\n";
        });

        if (!contentHtml) contentHtml = "（无内容）";

        return `
          <div class="poem-card">
            <h2>${title}</h2>
            <div class="poem-meta">
              ${author} · ${dynasty}代
            </div>
            <div class="poem-content">${escapeHtml(contentHtml)}</div>
            <div class="section-title">译文</div>
            <div class="translation">${escapeHtml(transHtml) || "（暂无译文）"}</div>
            <div class="section-title">注释</div>
            <div class="annotation">${escapeHtml(annHtml) || "（暂无注释）"}</div>
          </div>
        `;
      }).join("");

      // 分页按钮
      let pagerHtml = "";
      if (totalPages > 1) {
        pagerHtml = `
          <div class="pager">
            <button onclick="searchPoems(${currentPage - 1})" ${currentPage <= 1 ? "disabled" : ""}>上一页</button>
            <span>第 ${currentPage} / ${totalPages} 页</span>
            <button onclick="searchPoems(${currentPage + 1})" ${currentPage >= totalPages ? "disabled" : ""}>下一页</button>
          </div>
        `;
      }

      result.innerHTML = bioHtml + cards + pagerHtml;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // 简单的转义，防止特殊字符破坏页面
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // 初始化：默认展示李白（演示效果）
    document.getElementById("searchInput").value = "李白";
    searchPoems(1);
  </script>
</body>
</html>
