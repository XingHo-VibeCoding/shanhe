<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一句一画 · 诗中有画</title>
<style>
  :root{
    --bg:#f3eee2; --panel:#fffdf7; --paper:#f6f1e4; --ink:#23211c; --sub:#6b6658;
    --line:#e6dcc5; --accent:#2f6b52; --accent-soft:#e7efe7; --gold:#a9741f;
    --seal:#b03a2e; --warn:#b5462f; --warn-soft:#f6e8e4;
    --shadow:0 1px 2px rgba(30,28,20,.04),0 8px 28px rgba(30,28,20,.06);
    --maxw:820px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.72;font-size:16px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}

  header{padding:72px 0 40px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
  .seal{position:absolute;right:22px;top:50px;width:72px;height:72px;border-radius:8px;
    background:var(--seal);display:flex;align-items:center;justify-content:center;color:#f6ede0;
    font-size:26px;font-weight:700;letter-spacing:2px;writing-mode:vertical-rl;opacity:.92;
    font-family:"STKaiti","KaiTi","PingFang SC",serif;box-shadow:0 2px 6px rgba(120,40,30,.25)}
  .kicker{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:20px}
  .kicker svg{width:15px;height:15px}
  h1{font-size:42px;line-height:1.14;margin:0 0 14px;font-weight:700;letter-spacing:-.01em}
  h1 .en{display:block;font-size:19px;color:var(--sub);font-weight:500;margin-top:10px;letter-spacing:0}
  .meta{display:flex;flex-wrap:wrap;gap:18px;margin-top:26px;color:var(--sub);font-size:14px}
  .meta span{display:inline-flex;align-items:center;gap:7px}
  .meta svg{width:15px;height:15px;stroke:var(--sub)}
  .lede{margin-top:30px;font-size:18px;line-height:1.75;color:#423d31}
  .lede strong{color:var(--accent)}

  .cover-card{padding:36px 28px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin:30px 0 20px}
  .cover-art{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper)}
  .cover-art img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
  .cover-overlay{padding:22px 18px 20px;border-top:1px dashed var(--line);background:rgba(255,253,247,.75)}
  .cover-title{font-family:"STKaiti","KaiTi","PingFang SC",serif;font-size:38px;line-height:1.2;letter-spacing:.08em;margin:0 0 8px;color:var(--ink)}
  .cover-sub{margin:0;color:var(--sub);font-size:15px}
  .cover-hook{margin:12px 0 0;display:inline-block;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;letter-spacing:.04em}

  .fulltext{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:28px;margin:20px 0 0;box-shadow:var(--shadow);text-align:center}
  .fulltext h3{margin:0 0 4px;font-size:13px;letter-spacing:.14em;color:var(--gold);font-weight:700}
  .fulltext p{font-family:"STKaiti","KaiTi","PingFang SC",serif;font-size:21px;line-height:2;
    letter-spacing:.1em;margin:10px 0 0;color:var(--ink)}
  .fulltext .stan{margin-top:14px}

  nav.toc{position:sticky;top:0;z-index:5;background:rgba(243,238,226,.9);
    backdrop-filter:saturate(1.3) blur(8px);border-bottom:1px solid var(--line);display:none}
  nav.toc.on{display:block}
  .toc-inner{max-width:var(--maxw);margin:0 auto;padding:12px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .toc button{border:0;background:transparent;color:var(--sub);font:inherit;font-size:13.5px;
    padding:7px 13px;border-radius:999px;cursor:pointer;transition:.18s;white-space:nowrap}
  .toc button:hover{background:var(--accent-soft);color:var(--accent)}
  .toc button.active{background:var(--accent);color:#fff}

  section{padding:52px 0;border-bottom:1px solid var(--line)}
  .sec-num{font-size:13px;letter-spacing:.12em;color:var(--gold);font-weight:600;text-transform:uppercase}
  h2{font-size:28px;line-height:1.25;margin:10px 0;font-weight:700;letter-spacing:-.005em}
  .sec-intro{color:var(--sub);font-size:16px;margin:0 0 8px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:26px 28px;margin:24px 0;box-shadow:var(--shadow)}

  .verse{font-family:"STKaiti","KaiTi","Kai","PingFang SC","Noto Serif SC",serif;
    font-size:31px;line-height:1.45;text-align:center;margin:0 0 6px;letter-spacing:.14em;color:var(--ink);position:relative;}
  .verse .pin{display:block;font-size:12.5px;color:var(--gold);letter-spacing:.3em;margin-top:10px;font-family:inherit}
  .verse::after{content:"";display:block;width:44px;height:2px;background:var(--line);margin:16px auto 0}

  .ink-painting{border:1px solid var(--line);border-radius:12px;overflow:hidden;
    margin:22px 0 20px;line-height:0;position:relative;background:#f6f1e4;}
  .ink-painting img{width:100%;height:auto;display:block}
  .ink-painting figcaption{line-height:1.6;font-size:13px;color:var(--sub);text-align:center;padding:11px 16px 13px;
    background:rgba(255,253,247,.6);border-top:1px dashed var(--line);letter-spacing:.04em;}
  .ink-painting .dl, .cover-art .dl{display:table;margin:9px auto 0;padding:5px 16px;border:1px solid var(--line);
    border-radius:999px;background:var(--panel);color:var(--accent);font-size:12.5px;letter-spacing:.08em;
    text-decoration:none;transition:.18s}
  .ink-painting .dl:hover, .cover-art .dl:hover{border-color:var(--accent);background:var(--accent-soft)}
  .ink-painting .dl svg, .cover-art .dl svg{display:inline-block;width:13px;height:13px;vertical-align:-2px;margin-right:6px;
    stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .field{margin:0 0 0}
  .field + .field{margin-top:14px}
  .field .lbl{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
  .field p{margin:5px 0 0}
  .field .lbl.gold{color:var(--gold)}

  .gloss{font-size:15px;color:#423d31}
  .gloss b{color:var(--accent);font-weight:600}

  table{width:100%;border-collapse:collapse;margin:16px 0 0;font-size:14.5px}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--sub);font-weight:600;font-size:12.5px;letter-spacing:.04em}
  td b{color:var(--accent)}

  .takeaway{background:linear-gradient(180deg,#fffdf7,#f3f2e6);border:1px solid #e5dcc2}
  ol.big{counter-reset:t;list-style:none;padding:0;margin:8px 0 0}
  ol.big li{position:relative;padding:16px 8px 16px 56px;border-bottom:1px dashed var(--line);font-size:16.5px}
  ol.big li:last-child{border-bottom:0}
  ol.big li::before{counter-increment:t;content:counter(t);position:absolute;left:8px;top:14px;
    width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}

  /* ---------- 互动条 ---------- */
  .stats-bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;
    padding:22px 18px;background:var(--panel);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);margin:8px 0 0}
  .stat{display:inline-flex;align-items:center;gap:9px;padding:9px 20px;border:1px solid var(--line);
    border-radius:999px;background:var(--paper);color:var(--sub);font-size:14.5px;letter-spacing:.04em}
  .stat svg{width:16px;height:16px;stroke:var(--sub);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .stat b{color:var(--ink);font-weight:700}
  button.stat{cursor:pointer;font:inherit;font-size:14.5px;transition:transform .15s ease,opacity .15s ease,border-color .15s ease,color .15s ease}
  button.stat:hover{border-color:var(--accent);color:var(--accent)}
  button.stat:hover svg{stroke:var(--accent)}
  button.stat.done{border-color:var(--seal);color:var(--seal);background:var(--warn-soft)}
  button.stat.done svg{stroke:var(--seal);fill:var(--seal);opacity:.18}
  button.stat.done b{color:var(--seal)}
  button.stat:active{transform:scale(.96)}
  .stats-note{width:100%;text-align:center;font-size:12.5px;color:var(--sub);margin:6px 0 0;min-height:1.2em;opacity:0;transition:opacity .25s ease}
  .stats-note.on{opacity:1}

  footer{padding:40px 0 64px;color:var(--sub);font-size:13.5px;text-align:center}
  footer .badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:1px solid var(--line);
    border-radius:999px;background:var(--panel);margin-bottom:14px}
  footer .badge svg{width:15px;height:15px;stroke:var(--accent)}

  /* ---------- 加载 / 错误态 ---------- */
  .state-box{max-width:var(--maxw);margin:80px auto;padding:40px 28px;text-align:center;
    background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  .state-box .glyph{font-family:"STKaiti","KaiTi","PingFang SC",serif;font-size:40px;color:var(--gold);margin-bottom:12px}
  .state-box p{color:var(--sub);margin:0 0 18px}
  .state-box button{border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;
    font-size:14px;padding:9px 26px;border-radius:999px;cursor:pointer;transition:opacity .15s ease}
  .state-box button:hover{opacity:.85}

  @media(max-width:560px){
    h1{font-size:31px} h2{font-size:23px} header{padding:48px 0 32px}
    .card{padding:20px} .seal{display:none} .verse{font-size:26px}
    .stat{padding:8px 14px}
  }
</style>
</head>
<body>

<!-- ============ 加载 / 错误态（渲染后移除） ============ -->
<div class="state-box" id="state">
  <div class="glyph">画</div>
  <p id="stateMsg">正在展开画卷……</p>
  <button id="stateRetry" style="display:none">重新加载</button>
</div>

<!-- ============ 页头 ============ -->
<header id="pageHead" style="display:none">
  <div class="seal" id="seal"></div>
  <div class="wrap">
    <div class="kicker">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span id="kicker"></span>
    </div>
    <h1><span id="title"></span><span class="en" id="headingEn"></span></h1>
    <div class="meta" id="meta"></div>
    <p class="lede" id="lede"></p>
  </div>
</header>

<!-- ============ 目录 ============ -->
<nav class="toc" id="tocNav">
  <div class="toc-inner" id="toc"></div>
</nav>

<main class="wrap" id="main" style="display:none"></main>

<!-- ============ 互动条 ============ -->
<div class="wrap" id="statsWrap" style="display:none;padding:0 24px 8px">
  <div class="stats-bar" id="statsBar">
    <span class="stat" id="statViews">
      <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      浏览 <b id="numViews">0</b>
    </span>
    <button class="stat" id="btnLike">
      <svg viewBox="0 0 24 24"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>
      点赞 <b id="numLikes">0</b>
    </button>
    <button class="stat" id="btnFav">
      <svg viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16Z"/></svg>
      收藏 <b id="numFavs">0</b>
    </button>
    <p class="stats-note" id="statsNote"></p>
  </div>
</div>

<!-- ============ footer ============ -->
<footer id="pageFoot" style="display:none">
  <div class="wrap">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
      <span>诗词水墨蒸馏 · 一句一画</span>
    </div>
    <div id="footNote"></div>
    <div style="margin-top:10px;font-size:12.5px">本页为文化解读，不构成任何专业或投资建议</div>
  </div>
</footer>

<script>
  var API_BASE = 'https://shijishanhe-d5gmc8a0k01b1e88d.service.tcloudbase.com/api/ink';

  // ---------- 工具 ----------
  function qs(name){
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : '';
  }
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function safeFile(s){ return String(s||'').replace(/[，。、！？：；,.!?;:]/g,''); }
  function lsKey(action, slug){ return 'ink_' + action + '_' + slug; }

  function fetchRetry(url, opts, tries){
    tries = tries || 3;
    function once(){
      return fetch(url, opts).then(function(r){
        // 4xx 是业务应答（400/404 等带中文提示），直接透传不重试
        if(r.status >= 400 && r.status < 500 && r.status !== 429){ return r.json(); }
        if(!r.ok){ throw new Error('HTTP ' + r.status); }
        return r.json();
      });
    }
    return once().catch(function(e){
      if(tries > 1){ return fetchRetry(url, opts, tries - 1); }
      throw e;
    });
  }

  var DOWNLOAD_SVG = '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

  function showState(msg, retryable){
    document.getElementById('state').style.display = 'block';
    document.getElementById('stateMsg').textContent = msg;
    document.getElementById('stateRetry').style.display = retryable ? 'inline-block' : 'none';
  }
  function hideState(){ document.getElementById('state').style.display = 'none'; }

  // ---------- 渲染 ----------
  function render(d){
    var c = d.content || {};
    document.title = d.title + ' · 一句一画';

    // 页头
    document.getElementById('seal').textContent = c.seal || (d.title || '').slice(0, 2);
    document.getElementById('kicker').textContent = c.kicker || '诗词水墨蒸馏 · 一句一画';
    document.getElementById('title').textContent = d.title;
    document.getElementById('headingEn').textContent = [d.poet, d.form, d.dynasty].filter(Boolean).join(' · ');
    var metaHtml = (c.meta || []).map(function(m){ return '<span>' + esc(m) + '</span>'; }).join('');
    document.getElementById('meta').innerHTML = metaHtml;
    document.getElementById('lede').innerHTML = c.lede || d.lede || '';

    // 封面 + 全词 + 六章 + 意象 + 带走一句 → 全部装进 main
    var h = '';

    h += '<section style="padding-top:30px">';
    if(c.cover){
      h += '<div class="cover-card"><figure class="cover-art">'
        +  '<img src="' + esc(c.cover.src) + '" alt="' + esc(d.title + ' 封面水墨图') + '">'
        +  '<a class="dl" href="' + esc(c.cover.src) + '" download="' + esc(d.title + '·封面.jpg') + '">' + DOWNLOAD_SVG + '保存此画</a>'
        +  '</figure><div class="cover-overlay">'
        +  '<h2 class="cover-title">' + esc(d.title) + '</h2>'
        +  '<p class="cover-sub">' + esc(c.cover.sub) + '</p>'
        +  '<span class="cover-hook">' + esc(c.cover.hook) + '</span>'
        +  '</div></div>';
    }
    h += '<div class="fulltext"><h3>' + esc(c.fulltext_label || '全 词') + '</h3>'
      +  (c.fulltext || []).map(function(p){ return '<p class="stan">' + p + '</p>'; }).join('')
      +  '</div></section>';

    var secs = c.sections || [];
    secs.forEach(function(s, i){
      var id = 's' + (i + 1);
      h += '<section id="' + id + '">'
        +  '<div class="sec-num">' + esc(s.tag || '') + '</div>'
        +  '<h2>' + esc(s.heading || '') + '</h2>'
        +  '<p class="sec-intro">' + esc(s.intro || '') + '</p>'
        +  '<div class="card">'
        +  '<div class="verse">' + esc(s.verse) + '<span class="pin">' + esc(s.pinyin || '') + '</span></div>'
        +  '<figure class="ink-painting">'
        +  '<img src="' + esc(s.img) + '" alt="' + esc(s.alt || s.verse + ' 水墨画') + '" loading="lazy">'
        +  '<a class="dl" href="' + esc(s.img) + '" download="' + esc(safeFile(d.title + '·' + s.verse) + '.jpg') + '">' + DOWNLOAD_SVG + '保存此画</a>'
        +  '<figcaption>' + esc(s.caption || '') + '</figcaption>'
        +  '</figure>'
        +  '<div class="field"><span class="lbl">水墨画寓意</span><p>' + esc(s.meaning || '') + '</p></div>'
        +  '<div class="field"><span class="lbl gold">注解</span><p class="gloss">' + (s.gloss || '') + '</p></div>'
        +  '</div></section>';
    });

    if(c.imagery && c.imagery.length){
      h += '<section id="s' + (secs.length + 1) + '">'
        +  '<div class="sec-num">' + esc(c.imagery_label || '意象速查') + '</div>'
        +  '<h2>' + esc(c.imagery_title || '') + '</h2>'
        +  '<p class="sec-intro">' + esc(c.imagery_intro || '') + '</p>'
        +  '<table><thead><tr><th>意象</th><th>出处</th><th>象征</th></tr></thead><tbody>'
        +  c.imagery.map(function(r){
            return '<tr><td><b>' + esc(r.name) + '</b></td><td>' + esc(r.from) + '</td><td>' + esc(r.symbol) + '</td></tr>';
          }).join('')
        +  '</tbody></table></section>';
    }

    if(c.takeaways && c.takeaways.length){
      h += '<section id="s' + (secs.length + 2) + '" style="border-bottom:0">'
        +  '<div class="sec-num">' + esc(c.takeaway_label || 'Takeaway') + '</div>'
        +  '<h2>' + esc(c.takeaway_title || '') + '</h2>'
        +  '<div class="card takeaway"><ol class="big">'
        +  c.takeaways.map(function(t){ return '<li>' + t + '</li>'; }).join('')
        +  '</ol></div></section>';
    }

    var main = document.getElementById('main');
    main.innerHTML = h;
    main.style.display = 'block';
    document.getElementById('pageHead').style.display = 'block';
    document.getElementById('pageFoot').style.display = 'block';
    document.getElementById('statsWrap').style.display = 'block';
    document.getElementById('footNote').textContent = c.footer_note || '';

    // 目录
    var tocItems = secs.map(function(s, i){ return { id: 's' + (i + 1), label: s.toc || s.heading || ('其' + (i + 1)) }; });
    if(c.imagery && c.imagery.length){ tocItems.push({ id: 's' + (secs.length + 1), label: c.imagery_label || '意象速查' }); }
    if(c.takeaways && c.takeaways.length){ tocItems.push({ id: 's' + (secs.length + 2), label: c.takeaway_title || '带走一句' }); }
    var toc = document.getElementById('toc');
    toc.innerHTML = tocItems.map(function(t){
      return '<button data-target="' + t.id + '"' + (t.id === 's1' ? ' class="active"' : '') + '>' + esc(t.label) + '</button>';
    }).join('');
    document.getElementById('tocNav').classList.add('on');

    // 目录滚动 + 高亮
    var buttons = Array.prototype.slice.call(toc.querySelectorAll('button'));
    buttons.forEach(function(btn){
      btn.addEventListener('click', function(){
        var el = document.getElementById(btn.getAttribute('data-target'));
        if(el){ el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      });
    });
    var sections = buttons.map(function(b){ return document.getElementById(b.getAttribute('data-target')); });
    function onScroll(){
      var pos = window.scrollY + 140, idx = 0;
      for(var i = 0; i < sections.length; i++){ if(sections[i] && sections[i].offsetTop <= pos){ idx = i; } }
      buttons.forEach(function(b, i){ b.classList.toggle('active', i === idx); });
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  // ---------- 互动 ----------
  var slug = '';
  function note(msg){
    var n = document.getElementById('statsNote');
    n.textContent = msg;
    n.classList.add('on');
    setTimeout(function(){ n.classList.remove('on'); }, 2200);
  }
  function bump(action){
    return fetchRetry(API_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug: slug, action: action })
    }).then(function(d){
      if(!d.ok){ throw new Error(d.error || '计数失败'); }
      return d.data;
    });
  }
  function paintNums(s){
    document.getElementById('numViews').textContent = s.views;
    document.getElementById('numLikes').textContent = s.likes;
    document.getElementById('numFavs').textContent = s.favs;
  }
  function paintButtons(){
    document.getElementById('btnLike').classList.toggle('done', localStorage.getItem(lsKey('liked', slug)) === '1');
    document.getElementById('btnFav').classList.toggle('done', localStorage.getItem(lsKey('faved', slug)) === '1');
  }
  function bindStats(){
    var likeBtn = document.getElementById('btnLike');
    var favBtn = document.getElementById('btnFav');
    likeBtn.addEventListener('click', function(){
      var liked = localStorage.getItem(lsKey('liked', slug)) === '1';
      likeBtn.disabled = true;
      bump(liked ? 'unlike' : 'like').then(function(s){
        paintNums(s);
        if(liked){
          localStorage.removeItem(lsKey('liked', slug));
          note('已取消点赞');
        }else{
          localStorage.setItem(lsKey('liked', slug), '1');
          note('谢谢你的赞，落款已记下');
        }
        paintButtons();
      }).catch(function(){ note('网络不太顺畅，稍后再试'); }).finally(function(){ likeBtn.disabled = false; });
    });
    favBtn.addEventListener('click', function(){
      var faved = localStorage.getItem(lsKey('faved', slug)) === '1';
      favBtn.disabled = true;
      bump(faved ? 'unfav' : 'fav').then(function(s){
        paintNums(s);
        if(faved){
          localStorage.removeItem(lsKey('faved', slug));
          note('已从画匣取出');
        }else{
          localStorage.setItem(lsKey('faved', slug), '1');
          note('已收进画匣');
        }
        paintButtons();
      }).catch(function(){ note('网络不太顺畅，稍后再试'); }).finally(function(){ favBtn.disabled = false; });
    });
  }
  function countView(){
    // 同一标签页会话只计一次（刷新不重复计数，关掉再进才 +1）
    if(sessionStorage.getItem('ink_viewed_' + slug)){ return; }
    bump('view').then(function(s){
      paintNums(s);
      sessionStorage.setItem('ink_viewed_' + slug, '1');
    }).catch(function(){ /* 浏览量失败不打扰用户 */ });
  }

  // ---------- 入口 ----------
  function load(){
    slug = qs('slug') || 'dielianhua-chunjing';
    showState('正在展开画卷……', false);
    fetchRetry(API_BASE + '?slug=' + encodeURIComponent(slug))
      .then(function(d){
        if(!d.ok || !d.data){ throw new Error(d.error || '数据异常'); }
        hideState();
        render(d.data);
        paintNums({ views: d.data.views, likes: d.data.likes, favs: d.data.favs });
        paintButtons();
        bindStats();
        countView();
      })
      .catch(function(e){
        showState(e.message && e.message.indexOf('没有找到') === 0
          ? '没有找到这幅「一句一画」，检查一下链接里的 slug'
          : '画卷暂时打不开（网络或服务打盹了），稍后再试', true);
      });
  }
  document.getElementById('stateRetry').addEventListener('click', load);
  load();
</script>
</body>
</html>
